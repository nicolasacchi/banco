# Model providers per role (A-08, operator Q8 and Q8-bis). The session declares its model; the
# family comes from the first pattern that matches (case-insensitive, * is a
# wildcard). A model that matches nothing is family "unknown" and is allowed only
# where the role has no family rule. The declaration guards against mistakes, not
# against intent: nobody can prove a model.
#
# A change here is a change of rule: add a D-NNN entry in docs/decisions.md.
version: 1

families:
  anthropic: [ "claude*", "anthropic/*", "opus*", "sonnet*", "haiku*" ]
  openai: [ "gpt*", "o1*", "o3*", "o4*", "openai/*", "codex*" ]
  google: [ "gemini*", "gemma*", "google/*" ]
  xai: [ "grok*", "xai/*" ]
  moonshot: [ "kimi*", "moonshot*" ]
  zhipu: [ "glm*", "zhipu*", "z-ai/*" ]
  deepseek: [ "deepseek*" ]
  qwen: [ "qwen*", "alibaba/*" ]
  mistral: [ "mistral*", "mixtral*", "codestral*" ]
  meta: [ "llama*", "meta/*" ]

roles:
  author: {}
  verifier: {}
  # Reviewer and blind solver (operator Q8-bis, D-070): a different MODEL from the
  # model of every session that authored the item (the family may be the same: a
  # Sonnet reviews what an Opus wrote). A different session is enforced by
  # ItemSessions (E-SESSION-NOT-INDEPENDENT). They receive item text only.
  reviewer: { different_model_from: author }
  solver: { different_model_from: author }
  # The arbiter, the third reviewer of the findings (D-222). It gives a first opinion
  # (first_opinion_model) and a second one (second_opinion_model), and only these two models are
  # allowed. It runs on a model other than the session that raised the finding. No rule about the
  # author's model. Holding no other role on the item is enforced by ItemSessions.
  arbiter:
    allow_models: [ claude-opus-5-5, claude-haiku-4-5-20251001 ]
    first_opinion_model: claude-opus-5-5
    second_opinion_model: claude-haiku-4-5-20251001
    different_model_from_raiser: true
  # The grader reads the student's answers, a minor's data: only these families.
  grader: { allow_families: [ anthropic ] }
