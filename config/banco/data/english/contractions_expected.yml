# english/contractions_expected: the second table of english/contractions (WAVE2 1.9; T3, D-398). The same facts by another route, The Editor's Manual
# (Neha Karve), "Types of Contractions" (updated 2023-11-05): the list of the contracted forms, the table of the contracted not, the table of the
# contractions with the subject pronouns, the examples with that, who, here and there, «let's», and the section on the contractions with nouns. Accessed 2026-11-23.
#   forms  a written form with the whole of what it can stand for (the readings are what the page says: «she's» is she is or she has)
#   kept   an English text the grader leaves as typed: a noun with 's or 'd, which may be a possessive (the page gives «Lulu's a dancer» = Lulu is,
#          and the noun forms are «not generally seen in writing»); a possessive must never become a verb
# test/lib/contractions_data_test.rb: every form is read as listed by Grading::Closed::Contractions, every whole-word row of english/contractions is
# here, and every kept text is read as typed. Typed separately from english/contractions; a model of another family still reviews both (D-398).
version: 1
source: 'The Editor''s Manual (N. Karve), Types of Contractions, updated 2023-11-05; accessed 2026-11-23'
