# network/kinds (D-270): the kinds of arrow a `network` figure draws (WAVE2 2.1) and the objects an arrow carries.
# Not a fact of the world: our own vocabulary for relations between actors, one Italian verb phrase each, so that the figure and its
# description say the same words. `icon` is a name of config/banco/icons.yml (any list: the sprite of the icon is found by name);
# `arrow` is solid (a plain relation), dashed (a relation of trust or of a promise, that binds by other means than force) or double
# (an order or a veto: it overrides). A second table, typed separately, is test/fixtures/lesson2/network_kinds_expected.json.
version: 1
kinds:
  owes: {label_it: "deve", icon: hand-coins, arrow: solid}
  pays: {label_it: "paga", icon: banknote, arrow: solid}
  elects: {label_it: "elegge", icon: vote, arrow: solid}
  trusts: {label_it: "dà la fiducia", icon: handshake, arrow: dashed}
  appoints: {label_it: "nomina", icon: stamp, arrow: solid}
  commands: {label_it: "comanda", icon: crown, arrow: double}
  advises: {label_it: "consiglia", icon: messages-square, arrow: dashed}
  votes_laws: {label_it: "vota le leggi", icon: landmark, arrow: solid}
  vetoes: {label_it: "blocca", icon: ban, arrow: double}
  orders: {label_it: "ordina", icon: package, arrow: solid}
  promises: {label_it: "promette", icon: signature, arrow: dashed}
  gives: {label_it: "dà", icon: gift, arrow: solid}
  sends: {label_it: "manda", icon: truck, arrow: solid}
what:
  goods: {label_it: "merce", icon: package}
  money: {label_it: "denaro", icon: coins}
  document: {label_it: "documento", icon: file-text}
  order: {label_it: "ordine", icon: scroll-text}
  promise: {label_it: "promessa", icon: signature}
  signature: {label_it: "firma", icon: pen-line}
  information: {label_it: "informazione", icon: info}
  vote: {label_it: "voto", icon: vote}
