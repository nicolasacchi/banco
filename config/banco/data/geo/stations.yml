# geo/stations: climate normals 1991-2020 of 22 stations (WAVE2 1.9, D-270, D-272). Facts of the world: the author of a lesson names a row
# (`station: geo/stations.brasilia`) and our code draws what is here and computes the rest (arid months, range, total, extremes).
#
# Values are strings with the decimal comma, as published (one decimal). temp in degrees Celsius, precip in mm, January to December.
# The annual total, the range, the warmest and the coldest month, the arid months (P <= 2T) are never stored (1.1).
# Primary source: the national services' own submissions to the WMO, archived by NOAA NCEI (accession 0253808, version 4.4, composite
# primary-parameter files TAVG, TMAX, TMIN, PRCP, accessed 2026-10-12); Winnipeg: Environment and Climate Change Canada, Canadian Climate
# Normals 1991-2020. Temperature is the service's own monthly mean (TAVG) where it submitted one, else (Tmax + Tmin) / 2 of the same source
# (Mumbai, Calcutta). The second table (stations_expected.yml) holds an independent computation; tests/lib compares the two.
# Names: the Italian exonym of the school books (T5's rule for geo/names), the country after it on the printed label.
version: 1
stations:

  # mumbai: climates-biomes hero, c5, E2; try 7 candidate (monsoon)
  # flag (derived, temp): The national service submitted no mean temperature (TAVG) for this station; temp is (TMAX + TMIN) / 2, rounded half up to 0,1. Our code could derive it instead (1.1).
