# geo/stations_expected: the second table of geo/stations (WAVE2 1.9). Not the monthly values of another source: a summary of an independent
# computation of the same normals (Meteostat 1991-2020 bulk normals, derived by Meteostat from NOAA ISD/GHCN, DWD and national open data;
# for Roma Fiumicino our own mean of the NOAA GSOD daily files 1991-2020). The Meteostat data is CC BY-NC 4.0, so it is a cross-check
# and its monthly numbers are not copied here: only what our code derives from them (the annual mean, the annual total, the warmest and
# coldest month, the arid months by P <= 2T). The test derives the same from geo/stations and compares:
#   annual_temp within 0,5 degrees (`temp_band` says why a wider band is accepted), annual_precip within max(20 mm, 10 %),
#   the same warmest and coldest month, the same arid months except those named in `arid_differs` (within the noise of the rule).
# A difference above the band is a wrong id or a mistyped value, not a rounding.
expected:
  mumbai:
    source: meteostat9120
    annual_temp: '27,9'
    annual_precip: '2317'
    warmest: 5
    coldest: 1
    arid: [1, 2, 3, 4, 5, 11, 12]
  tokyo:
    source: meteostat9120
    annual_temp: '16,8'
    annual_precip: '1598'
    warmest: 8
    coldest: 1
    arid: []
    temp_band: '1,25'
    temp_band_why: "the national service's mean uses another daily-mean definition than (Tmax + Tmin) / 2 of the second source"
  winnipeg:
    source: meteostat9120
    annual_temp: '3,1'
