# chem/elements: the 118 elements (W2-D08, WAVE2 1.9; T7). Read by `formula`, `periodic_table` and the symbol lint (E-CHEM-SYMBOL).
# Typed by the data author from primary sources and kept in git; changed only by a D entry. Each row's `source` names where it comes from:
#   - symbol and mass: CIAAW, Abridged Standard Atomic Weights (ciaaw.org, 2024 revisions included, accessed 2026-10-12); for the elements with no
#     standard atomic weight (Tc, Pm and every element from Po on except Th, Pa, U) the mass number of the longest-lived isotope, as the IUPAC
#     table prints it in brackets (an integer string, not a weight).
#   - name_it: IUPAC, Tavola Periodica degli Elementi, Italian version of 15 July 2024 (CNR, Commissione NAO-IUPAC); where Zanichelli's
#     table differs (kripton/cripton, holmio/olmio, hafnio/afnio, darmstadtio/darmstadio) the IUPAC name stands and the difference is on the
#     teacher's conventions list.
#   - state_25c and category: PubChem Periodic Table (NCBI/NIH, accessed 2026-10-12), cross-checked with Zanichelli's melting and boiling points
#     and Wikidata. State 'unknown' where nothing was ever made in a weighable amount (from Fm on). Ga, Cs and Fr melt at 30, 28 and 27 degrees C:
#     solid at 25 degrees C. Se and Po sit on the edge of metalloid: PubChem's category stands (Se nonmetal, Po metalloid).
#   - group: the IUPAC 18-column layout; null for the f-block rows (La-Lu and Ac-Lr), group 3 holds Sc and Y.
#   - origin_it, latin: only for the elements whose symbol does not come from the Italian name (`mark_latin` is the set that has a `latin`).
# The second table is chem/elements_expected: a separate extraction (PubChem symbol, mass, state; Zanichelli's name) the unit test compares.
