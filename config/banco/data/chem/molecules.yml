# chem/molecules: the substances of ponte.chemistry.symbols-formulas (W2-D08, WAVE2 1.9; T7). Read by `molecule` and `formula`.
# Typed by the data author, kept in git, changed only by a D entry. Sources: CCCBDB (NIST Standard Reference Database 101, experimental
# geometries, accessed 2026-10-12) for atoms, bond orders, Cartesian coordinates and angles; PubChem compound records (bond orders of the 2D
# record, the ions of the salts as separate covalent units) as the second source; Pauling electronegativities (PubChem periodic table and
# Zanichelli's Tavola periodica) for the sign of the partial charges; Treccani and it.wikipedia for the names.
#   atoms     in CCCBDB's order; `xyz` is the experimental Cartesian position in angstrom (3 decimals); `xy` is a drawing position our script
#             derived from it by a projection (the plane of the two widest spreads; for CH4 the view along an axis (a square) and for NH3 the view
#             along its axis (a triangle), so that no H atom falls on another). Atom counts are never stored: Lessons::Chem computes them from the formula.
#   angle     in degrees, computed from the Cartesians and rounded half up to 0,1 (H2O 104,5 as the books print it); only on molecules whose
#             bond angle is drawn between two bonds of one atom.
#   partial_charges   RELATIVE units that add up to zero: the SIGN is the fact (Pauling electronegativity difference at least 0,4), the size only
#             keeps the sum at zero. CO has none on purpose (its dipole is small and not what the electronegativity rule predicts); CH4 has none
#             (C-H differs by 0,35); the homonuclear molecules have none.
#   ionic     the atoms of ONE formula unit, ions in order (the cation first); positions are schematic, the ion is drawn as one circle.
#   metal     one atom: the metal is drawn as a patch of identical circles, never as a molecule.
version: 1
molecules:
