  W-LANG-LEVEL: { stage: ruby, severity: warning, description: "A target-language word outside the first 3000 words, the lesson's glossary and its teaches_en or teaches_es list; the reviewer judges. On every _en or _es text of a bilingual revision, items included (D-402)." }
  # The bilingual courses of english and spanish (D-402): every student text of a bilingual revision is a pair, the target language under <base>_en|_es and its Italian under <base>_it.
  E-LANG-BILINGUAL-REQUIRED: { stage: ruby, severity: error, description: "A new revision of an english or spanish item or lesson without bilingual: true (lang.bilingual_required in validation_rules.yml; a revision that passed under older rules keeps its pass)." }
  E-LANG-BILINGUAL-FLAG: { stage: ruby, severity: error, description: "bilingual: true in a subject that does not teach a language, a _en or _es sibling in a revision without the flag, or a sibling in another language than the subject's." }
