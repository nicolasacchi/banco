# The one registry of codes (X-03, A-06, E-05). Validation and API codes are
# E-/W- names; codes the grader emits are snake_case. A name that differs between
# the grader and the rules would silently switch a mask off, so Rules::V1 and the
# grader read their names from here (test/lib/error_codes_test.rb).
#
# version: bumped when a code is added, removed or changes meaning.
# severity: error blocks approval (E-) or is refused; warning is shown to the
#   reviewer and the teacher (W-).
# stage: where the code is raised (schema, ruby, chrome, roundtrip, verify,
#   blueprint, review, grading, api).
version: 24

validation:
  # Skill graph (synchronous).
  E-SCHEMA: { stage: schema, severity: error, description: "The file does not match its JSON Schema (banco.skill_graph/1, banco.item/1, banco.blueprint/1, banco.review/1, banco.solve/1, banco.lesson/1, banco.course/1, banco.topic/1, banco.lesson_review/1)." }
  E-GRAPH-CYCLE: { stage: ruby, severity: error, description: "The prerequisite edges form a cycle." }
  E-SOURCE: { stage: ruby, severity: error, description: "A citation is not an exact substring of a pdf-origin line, cites a transcript line, or names a missing line." }
  E-SCOPE: { stage: ruby, severity: error, description: "Scope does not match the citations: middle_school and not_in_prima skills have no prima refs and carry a reason; studied, integration_studied and in_progress have at least one." }
  W-REF-OTHER-SUBJECT: { stage: ruby, severity: warning, description: "A skill cites a programme line under a different \"## \" section than most of the graph's citations of that source: probably another subject's line; say so in the skill's scope_reason_it, naming the line number (then the warning is quiet)." }
  W-SCOPE-MARKER: { stage: ruby, severity: warning, description: "A skill's scope disagrees with the star markers of the previous-year lines it cites (the star inside the cited fragment, else the marker of the line or of the header of its block)." }
  E-NEEDED-BY: { stage: ruby, severity: error, description: "A skill has no seconda needed_by ref and is not a transitive prerequisite of a skill that has one." }
  E-GRAPH-EDGE-UNAPPROVED: { stage: ruby, severity: error, description: "A cross-subject prerequisite points at a skill that is not in an approved graph." }
  # Item structure.
  E-SKILL-UNKNOWN: { stage: ruby, severity: error, description: "The item names a skill that is not in the subject's graph." }
  E-ASSET: { stage: ruby, severity: error, description: "An asset has no source, an SVG carries script, on* handlers, foreignObject or an external href, or a file is over 200 KB." }
  E-COMPOSITE: { stage: ruby, severity: error, description: "A multi-step item implicates two or more distinct prerequisites but its skill is not a composite listing them." }
  E-TESTLET-SKILLS: { stage: ruby, severity: error, description: "The sub items of a testlet are not all on one skill: the testlet has one attempt, counted for its first skill only." }
  # Generator.
  E-CODE-GLOBAL: { stage: ruby, severity: error, description: "The generator or verify uses a banned global or import (Math.random, Date, performance, crypto, Intl, toLocaleString, eval, Function, fetch, XMLHttpRequest, WebSocket, import(, importScripts, or an import other than /lib/rng.mjs and /lib/fmt.mjs)." }
  E-GEN-NONDETERMINISTIC: { stage: chrome, severity: error, description: "Two fresh contexts gave a different canonical output for the same seed." }
  E-GEN-THROW: { stage: chrome, severity: error, description: "generate(seed, rng) threw." }
  E-GEN-TIMEOUT: { stage: chrome, severity: error, description: "One generate call took more than 2 s." }
  E-GEN-SCHEMA: { stage: chrome, severity: error, description: "The output is over 16 KB or has the wrong shape." }
  E-GEN-POOL: { stage: chrome, severity: error, description: "Fewer than 24 clean seeds of 1..200, more than 20% problem seeds, or fewer than 20 distinct displays among 24." }
  # Component fit.
  E-COMPONENT-NUMERIC: { stage: ruby, severity: error, description: "An expression item whose expected value is rational with no letters must use number or fraction." }
  E-EXPONENT-MULTIDIGIT: { stage: ruby, severity: error, description: "An expression item has an exponent of 10 or more in an expected or catalogue value." }
  # Grading round trip.
  E-ROUNDTRIP: { stage: roundtrip, severity: error, description: "An error value does not come back from the grader with its code." }
  E-ERROR-NEVER-GENERATED: { stage: roundtrip, severity: error, description: "A catalogue error is never produced by any clean seed." }
  E-ACCEPTS-RANDOM: { stage: roundtrip, severity: error, description: "The grader accepted one of 200 random well-formed answers." }
  E-STEP-INCONSISTENT: { stage: roundtrip, severity: error, description: "The solution steps contradict the answer." }
  # Verify.
  E-VERIFY-MISSING: { stage: verify, severity: error, description: "There is no verify.mjs yet; instances are materialized anyway." }
  E-VERIFY-AUTHOR: { stage: verify, severity: error, description: "verify.mjs was added or changed by a session that is not a verifier." }
  E-VERIFY-STALE: { stage: verify, severity: error, description: "The verify.mjs carried forward from the base rejects clean seeds of a changed generator or item, or accepts its wrong answers (D-150). A verifier refreshes it; the author changes nothing (D-141). Counted as awaiting the verifier, like E-VERIFY-MISSING." }
  E-VERIFY-REJECTS: { stage: verify, severity: error, description: "verify rejects a clean seed." }
  E-VERIFY-VACUOUS: { stage: verify, severity: error, description: "verify accepts a catalogue error value or a +1 or sign-flip mutant." }
  E-SESSION-NOT-INDEPENDENT: { stage: verify, severity: error, description: "The author, verifier, reviewer and solver sessions of an item are not disjoint." }
  # Leak.
  E-DISPLAY-KEY: { stage: ruby, severity: error, description: "The display carries a key, a verdict or a field that reveals the answer." }
  E-SOLUTION-IN-DISPLAY: { stage: ruby, severity: error, description: "The normalized expected answer (3+ characters) appears in a non-stem display string or SVG text, or the key option's text appears outside the options array." }
  E-SUPPORT-LEAK: { stage: ruby, severity: error, description: "An answer_format_it or a steps_it text (of the item, a sub item or an instance display) states the key or a declared error value of an instance (D-216)." }
  W-STEPS-METHOD: { stage: ruby, severity: warning, description: "A steps_it text names a method word of the item's subject (the rules file, supports.method_words): steps say what to do, not how (D-216)." }
  W-ANSWER-IN-STEM: { stage: ruby, severity: warning, description: "The expected answer appears in the stem." }
  W-TESTLET-LEAK: { stage: ruby, severity: warning, description: "A testlet sub-item's key appears in the passage (written keys) or in another sub-item's display." }
  W-MESSAGE-GIVES-KEY: { stage: ruby, severity: warning, description: "An error_catalogue message_it states the key (6+ plain characters) of one of the item's static instances." }
  # Choice, ordering, matching.
  E-CHOICE-OPTIONS: { stage: ruby, severity: error, description: "A choice item has fewer than 3 or more than 5 options (never 2), or an ordering item has fewer than 3 or more than 7 elements." }
  E-DISTRACTOR-UNCODED: { stage: ruby, severity: error, description: "A distractor carries no error code from the catalogue." }
  E-OPTION-DUPLICATE: { stage: ruby, severity: error, description: "Two options have the same normalized text." }
  W-ERROR-UNREACHABLE: { stage: ruby, severity: warning, description: "A matching error value uses one right-hand id more than once while the widget allows each once (no reuse_right): the value can never be submitted, so its code cannot fire (D-145)." }
  W-LONGEST-CORRECT: { stage: ruby, severity: warning, description: "The correct option is the longest in too many instances." }
  W-INSTANCES-ALIKE: { stage: ruby, severity: warning, description: "Two instances of one item share more than half of their rows: the left rows of a matching, the elements of an ordering, or the options of a choice with the same stem. A repeat must look like a different question (D-297)." }
  E-MATCHING-SIZE: { stage: ruby, severity: error, description: "A matching item has fewer than 4 pairs or a right column that is not n+1." }
  W-MATCHING-JUDGE-ROWS: { stage: ruby, severity: warning, description: "A judge matching (a right column of two options: right or wrong, true or false) has an instance with fewer than 2 rows of one option in its key: one option for every row gets all rows right but one, so the instance measures little (the grader never counts it nearly correct). Give every instance at least 2 rows of each option (D-314)." }
  # Text.
  E-ACCENT-POLICY: { stage: ruby, severity: error, description: "accent_policy and the paradigm forms contradict each other." }
  E-ACCENT-DIRECTION: { stage: ruby, severity: error, description: "A choice instance has two options that differ only in the direction of an accent (grave or acute), or a declared error value is the key up to that direction. The direction is never tested (D-296)." }
  E-PROVA-A-PARAMS: { stage: ruby, severity: error, description: "An item built on last year's exam structure reuses its numbers instead of new ones." }
  # Readability (Italian instructional text only).
  E-READ: { stage: ruby, severity: error, description: "A readability rule failed; the rule name is in the detail (see read_rules).", read_rules: [markup, emoji, all_caps, sentence_length, stem_length, bold_spans, bold_span_length] }
  E-PHRASE: { stage: ruby, severity: error, description: "A banned phrase is present (exam-gaming, self-certification, personalisation)." }
  E-MESSAGE: { stage: ruby, severity: error, description: "A message_it is longer than two sentences." }
  E-QUOTE-REF: { stage: ruby, severity: error, description: "A quote reference does not resolve to an imported reference text, or the quote is not an exact substring of it." }
  W-GULPEASE: { stage: ruby, severity: warning, description: "Gulpease readability index below the threshold." }
  W-PASSAGE-READABILITY: { stage: ruby, severity: warning, description: "A reading passage is harder than the threshold." }
  W-ABSOLUTE: { stage: ruby, severity: warning, description: "An absolute word (always, never, only) that needs a counterexample check." }
  W-NEGATIVE-STEM: { stage: ruby, severity: warning, description: "The stem is phrased as a negation." }
  W-DECIMAL-POINT: { stage: ruby, severity: warning, description: "A decimal point where the Italian comma is expected." }
  W-SELF-CERT: { stage: ruby, severity: warning, description: "Self-certifying wording." }
  E-MATCHING-RIGHT-MARKUP: { stage: ruby, severity: error, description: "A right-column text of a matching holds LaTeX or markup ($, backslash, **): it is drawn as a native option, which renders plain text only." }
  W-GRAPH-DEFERRED-APPROVED: { stage: ruby, severity: warning, description: "A deferred_prerequisites or deferred_implicates entry names a skill that is already in an approved graph: it can be a plain prerequisite or implicate now." }
  W-GRAPH-READABILITY: { stage: ruby, severity: warning, description: "A *_it text of a skill graph (an error description, a skill name) breaks the readability rule an item text would fail (E-READ): the same text copied into an item error catalogue is refused." }
  W-ERROR-NOT-IN-GRAPH: { stage: ruby, severity: warning, description: "An item's error code is not an error of its skill in the graph, or its implicates differ from the graph's: the engine reads the graph alone." }
  W-FORM-SKILL-CLOSURE: { stage: ruby, severity: warning, description: "An item's form_skill is not in the prerequisite closure of its skill: a wrong form gets credit but no tail suspect." }
  W-ACCEPT-ITEM-LEVEL: { stage: ruby, severity: warning, description: "A static normalized_text item with two or more different keys has an item-level accept entry that is not within one edit of every key: it is graded correct on every instance. Move a spelling of one key to that instance's own accept (D-081, D-208)." }
  W-CALCULATOR: { stage: ruby, severity: warning, description: "A numeric item in a subject that allows the calculator lacks the sentence that says so." }
  W-IMPLICATE-PENDING: { stage: ruby, severity: warning, description: "An error_catalogue implicate names a skill of another subject whose graph is not approved yet. The engine reads implicates from the graph, so the item's list is ignored anyway; declare the edge as deferred_implicates in the graph and move it after the other graph is approved (D-135)." }
  # Blueprint (synchronous).
  W-SHORT-SKILL-CLOSED: { stage: blueprint, severity: warning, description: "Closed items are pinned on the skill of a pinned short answer: the engine serves only the short answer there, so they are never seen and do not count for the redo pool." }
  W-STALE-PIN: { stage: blueprint, severity: warning, description: "A pinned item revision still counts as passed but a newer passed revision of the same item exists. The engine would serve the old one; pin the newest (D-136). The teacher's approval checklist refuses it." }
  W-RULES-OUTDATED: { stage: blueprint, severity: warning, description: "A pinned item revision passed under an older rules version than the current one. The stored validation is not re-run, so an unchanged resubmission may fail the current rules; dry-run it (banco work submit DIR --dry-run) and resubmit it if it fails (D-149)." }
  W-TESTLET-MULTI-SKILL: { stage: blueprint, severity: warning, description: "A pinned testlet revision has sub items on several skills (stored and passed before E-TESTLET-SKILLS, D-098). The engine counts all its answers for the first sub item's skill only; the teacher's approval checklist refuses it. Resubmit the testlet with one skill (D-144)." }
  W-GUEST-UNAPPROVED: { stage: blueprint, severity: warning, description: "A guest starting skill sits in a graph of its own subject that is not approved yet. The draft and the dry run accept it; the teacher cannot approve the blueprint until that graph is approved (D-129)." }
  E-POOL-REDO: { stage: blueprint, severity: error, description: "A skill has fewer than 6 distinct-fingerprint instances across 2 items with 3 low-guess, and does not declare redo_reserve false; or a pinned descent skill has no low-guess instance." }
  E-BLUEPRINT-ENTRIES: { stage: blueprint, severity: error, description: "The blueprint has fewer than 4 or more than 10 entries." }
  E-BLUEPRINT-UNPINNED-DESCENT: { stage: blueprint, severity: error, description: "A skill the descent can reach from the starting skills has neither pinned items nor a not_assessed reason in descent[] (D-038)." }
  E-ITEM-NOT-PASSED: { stage: blueprint, severity: error, description: "A pinned item revision has no passed validation." }
  # Review and blind solve.
  E-QUOTE-NOT-FOUND: { stage: review, severity: error, description: "A review finding quotes text that is not an exact substring of the item." }
  E-REVIEW-EMPTY: { stage: review, severity: error, description: "A review without evidence (a bare 'all verified')." }
  E-BLIND-SOLVE-MISMATCH: { stage: review, severity: error, description: "The blind solver's answer disagrees with the key; stored as a blocker finding." }
  E-PROVIDER-NOT-ALLOWED: { stage: review, severity: error, description: "The session's provider is outside the allowlist for this role." }
  # Phase 1b: the course formats (A3.2 of the slice spec).
  E-LESSON-PARSE: { stage: ruby, severity: error, description: "No front matter between two --- lines, YAML does not load, not a mapping, or kind/subject disagree with the key." }
  E-LESSON-SECTIONS: { stage: ruby, severity: error, description: "One of the eight fixed ## headings missing, extra, renamed or out of order." }
  E-LESSON-MARKUP: { stage: ruby, severity: error, description: "Markup outside v2, including bare math (line and construct)." }
  E-LESSON-WORDS: { stage: ruby, severity: error, description: "More than lesson.max_words outside Prova tu and Soluzioni." }
  E-LESSON-BOLD: { stage: ruby, severity: error, description: "Bold above lesson.max_bold_ratio." }
  E-LESSON-EXERCISES: { stage: ruby, severity: error, description: "Prova tu count outside lesson.exercises, Soluzioni count differs, numbering not 1..N." }
  E-LESSON-FINALS: { stage: ruby, severity: error, description: "The finals_it length differs from the exercise count." }
  E-LESSON-BOOK: { stage: ruby, severity: error, description: "Sul libro does not start with lesson.book_line, or adds more than lesson.book_extra_words words." }
  E-LESSON-PAGE: { stage: ruby, severity: error, description: "A page number anywhere (lesson.page_pattern)." }
  E-LESSON-SUMMARY: { stage: ruby, severity: error, description: "In sintesi is not one unordered list of lesson.summary_points points." }
  E-LESSON-REFS: { stage: ruby, severity: error, description: "The kind's scope and ref rules (A2.1) are not met." }
  W-LESSON-WHY: { stage: ruby, severity: warning, description: "Perché ti serve outside lesson.why_sentences sentences." }
  W-LESSON-MISTAKES: { stage: ruby, severity: warning, description: "Fewer than lesson.mistakes_min list items in Errori da evitare." }
  W-LESSON-FINAL-MISSING: { stage: ruby, severity: warning, description: "A final (normalized: no spaces, no dollar signs, the minus sign as hyphen) is not a substring of its normalized solution; informational." }
  W-LESSON-FINAL-IN-TRY: { stage: ruby, severity: warning, description: "A final (normalized) appears in its own exercise text." }
  E-LESSON-REVIEW-RECOMPUTED: { stage: review, severity: error, description: "Math: too few recomputed entries, or an exercise with a final has none." }
  # banco.lesson/2 (D-245..D-250): cards of typed blocks, the diagram DSL, the render check.
  E-LESSON-CARD: { stage: ruby, severity: error, description: "A card heading without a valid {tag} or with a repeated or unknown token, a duplicate card id, text before the first card or part, or a part with fewer than lesson2.part_min_cards cards." }
  E-LESSON-CARDS: { stage: ruby, severity: error, description: "Core cards outside lesson2.core_cards, a role missing or repeated, or the order of roles broken (idea before example, then mistakes, try, summary; extra cards after the summary)." }
  E-CARD-WORDS: { stage: ruby, severity: error, description: "A core card holds more prose than lesson2.max_card_words, or a callout more than lesson2.callout_words." }
  E-CARD-BLOCKS: { stage: ruby, severity: error, description: "A card has fewer or more blocks than lesson2.blocks_per_card." }
  E-CARD-NO-VISUAL: { stage: ruby, severity: error, description: "An idea card has no diagram, schema, procedure, image, page or cases block holding a diagram (a formula or a callout is not a visual)." }
  E-CARD-ROLES: { stage: ruby, severity: error, description: "A card's running text uses more than lesson2.icon_roles_per_card colour roles whose carrier is an icon." }
  E-LESSON-BLOCK: { stage: ruby, severity: error, description: "A directive or block that is unknown, not available in this release, not closed, nested where only more may nest, with a YAML error, with a body that fails its schema, or with a double-quoted YAML string holding a backslash." }
  E-LESSON-EXTRA-WORDS: { stage: ruby, severity: error, description: "Depth (more blocks and extra cards) above lesson2.extra_words, or one more block above lesson2.more_words." }
  E-LESSON-MAP: { stage: ruby, severity: error, description: "The summary card has no schema, or a schema has the wrong number of nodes or a shape that does not hold (a cycle, no root, too many children)." }
  E-LESSON-CHECK: { stage: ruby, severity: error, description: "A check whose answer is not among its options, whose number or fraction does not parse under the practice rules, or whose error answer equals the answer." }
  E-LESSON-CHECKS: { stage: ruby, severity: error, description: "The number of checks (step blanks included) outside lesson2.checks_core, more than lesson2.checks_extra_max in extra cards, more than lesson2.blanks_max blanks, or more than the limits of the try card." }
  E-LESSON-VISUALS: { stage: ruby, severity: error, description: "More diagrams, schemas and procedures than lesson2.visuals_core_max (extras: lesson2.visuals_extra_max), or a diagram with more than lesson2.states_max states." }
  E-LESSON-PARTS: { stage: ruby, severity: error, description: "Parts that are neither none nor lesson2.parts, the first card not after the first part heading, or a part with too few cards." }
  E-LESSON-DIAGRAM: { stage: ruby, severity: error, description: "A diagram or schema whose data is not valid: a semantic check of its type failed (the detail names the path), a label longer than lesson2.label_words, or a key that belongs to the top level inside a state." }
  E-LESSON-ALT: { stage: ruby, severity: error, description: "A diagram or schema alt_it outside lesson2.alt_words." }
  E-LESSON-ROLE: { stage: ruby, severity: error, description: "A colour role that is not in the subject's palette (config/banco/lesson_palette.yml), in a span, a formula, a diagram, a legend or a tone." }
  E-LESSON-ICON: { stage: ruby, severity: error, description: "An icon name that is not in config/banco/icons.yml for the subject (the ui icons are ours)." }
  E-LESSON-LINK: { stage: ruby, severity: error, description: "A link to a card id or a topic key that does not exist." }
  E-LESSON-SIZE: { stage: ruby, severity: error, description: "The source is larger than lesson2.max_bytes or the assets than lesson2.max_assets_bytes." }
  E-LESSON-SCHEMA: { stage: ruby, severity: error, description: "A banco.lesson/1 file submitted after lesson.accept_schema1 was set to false (D-251): write banco.lesson/2." }
  E-LESSON-RENDER: { stage: chrome, severity: error, description: "The render check in the server's Chrome failed: an exception, a formula KaTeX refused, an unreadable card (a layout that cannot fit at the student's text size) or a timeout." }
  E-LESSON-OVERFLOW: { stage: chrome, severity: error, description: "A card is wider than its viewport (horizontal overflow) at one of the render check's viewports." }
  E-DIAGRAM-LAYOUT: { stage: chrome, severity: error, description: "A diagram's layout returned an error or two label boxes overlap: shorten the labels or reduce the marks." }
  E-DIAGRAM-SMALL-TEXT: { stage: chrome, severity: error, description: "A text or a diagram label is drawn under the student's base text size." }
  # Wave 2 of the rich lessons (WAVE2-COMPONENTS V5, D-265..D-269; rules version 9). The checks are built by the tracks of W2-1;
  # each code has a bad fixture described in test/fixtures/lesson2/manifest.json under `pending` until its track writes it.
  E-LESSON-DATA: { stage: ruby, severity: error, description: "A reference to a vetted data table (config/banco/data) that names no row, or a value that disagrees with its table (a station, a size, an element, a verb)." }
  E-LESSON-VERIFY: { stage: ruby, severity: error, description: "A check's verify function disagrees with its answer, or a coded wrong answer equals no mutant of the function (program.* functions are checked at the render check)." }
  E-CHECK-ANSWER-IN-ALT: { stage: ruby, severity: error, description: "The alt_it or caption_it of a select check's own figure names a target that is the answer." }
  W-CHECK-ANSWER-IN-DIAGRAM: { stage: ruby, severity: warning, description: "A text-answer check whose answer equals a string that a figure of the same card prints in any of its states, describe() included." }
  E-CHECK-ANSWER-BY-SIMULATION: { stage: ruby, severity: error, description: "A check whose answer equals an output an interactive figure of the same card can show inside its declared ranges; the only way past is reachable_ok_it on the check." }
  E-DIAGRAM-REACHABLE-CAP: { stage: ruby, severity: error, description: "A figure on a card with a check can show more than 500 values within its declared ranges: narrow the ranges or move the check." }
  E-SELECT-MARKED: { stage: ruby, severity: error, description: "A select check's candidate is drawn in a style that differs from the other candidates (a label, an icon, a role class, a pattern, a size): the answer would show." }
  E-DIAGRAM-TARGET: { stage: chrome, severity: error, description: "A select target is smaller than 24 x 24 CSS px at 390 px." }
  W-TYPE-RESERVED: { stage: ruby, severity: warning, description: "Reserved dry run only: the lesson uses a block, type, view or option that is reserved (schema frozen or only a name); it is validated against its frozen schema and can never be stored." }
  W-TYPE-DRAFT: { stage: ruby, severity: warning, description: "Reserved dry run only: the lesson uses a piece of a W2-2 draft; it is validated against its draft schema and can never be stored." }
  E-PROGRAM-BOUND: { stage: chrome, severity: error, description: "A program run at the render check broke a bound: more than 200 executed blocks, more than 12 trace rows, a division by 0, a value over 10^6 or a decimal that does not end, or no end without endless." }
  E-LESSON-APPARATUS-WORDS: { stage: ruby, severity: error, description: "The apparatus words open by default (quotations, translations, dialogue lines, reveal texts, mirror rows, document blocks, glossary definitions) exceed lesson2.apparatus_words, or the originals closed by default exceed lesson2.closed_original_words." }
  E-CHEM-SYMBOL: { stage: ruby, severity: error, description: "An element symbol inside \\ce{} or \\mathrm{} that is not in chem/elements, case-exact." }
  W-ES-TILDE: { stage: ruby, severity: warning, description: "A Spanish word written with a tilde that the stress rule does not need, or without the tilde it needs." }
  E-LESSON-LANG: { stage: ruby, severity: error, description: "A target-language key (_en, _es, _la) in a subject that does not teach that language, two target languages in one figure, or Italian text that the lint can tell in a _en or _es key." }
  W-LANG-LEVEL: { stage: ruby, severity: warning, description: "A target-language word outside the first 3000 words, the lesson's glossary and its teaches_en or teaches_es list; the reviewer judges." }
  W-LESSON-CHECKS-SPARSE: { stage: ruby, severity: warning, description: "Three idea or example cards in a row with no check or step blank." }
  W-CHECK-ANSWER-IN-PROMPT: { stage: ruby, severity: warning, description: "A check's answer text appears in its own prompt." }
  W-MISTAKE-CODE: { stage: ruby, severity: warning, description: "A mistake or check error code that is not in the skills' error catalogue." }
  E-COURSE-SKILL-DUPLICATE: { stage: ruby, severity: error, description: "A course skill key is in the graph it is validated against, or twice in the map." }
  E-COURSE-TOPIC: { stage: ruby, severity: error, description: "The key, kind and subject disagree, duplicate topic, a skill in two topics or of another subject, unknown topic in after, a cycle in after." }
  W-COURSE-ORDER: { stage: ruby, severity: warning, description: "A topic before one of its after topics, or before the topic holding a direct prerequisite of its skills." }
  W-COURSE-GRAPH-STALE: { stage: ruby, severity: warning, description: "A newer graph revision exists than the one the map was validated against." }
  E-TOPIC-UNKNOWN: { stage: ruby, severity: error, description: "The key is not a topic of the subject's latest course map." }
  E-TOPIC-PIN: { stage: ruby, severity: error, description: "The lesson with the topic key or a pinned revision does not exist, or a pinned revision is not a revision of the named lesson or item." }
  E-TOPIC-SKILLS: { stage: ruby, severity: error, description: "Practice skills differ from the map topic's skills, a skill twice, an item pinned twice, or the pinned lesson's skills differ from the topic's." }
  E-TOPIC-ITEM-KIND: { stage: ruby, severity: error, description: "A pinned item is not a practice_item, or its skill is not the entry's skill." }
  E-TOPIC-POOL: { stage: ruby, severity: error, description: "Per skill: no level-1 item, fewer than practice.topic_min_instances_per_skill distinct fingerprints, or fewer than practice.topic_min_low_guess_instances_per_skill low-guess ones." }
  W-TOPIC-INSTANCE-IN-LESSON: { stage: ruby, severity: warning, description: "A pinned instance display equals (normalized) a lesson exercise or worked-example line." }
  W-PRACTICE-DIAGNOSIS-OVERLAP: { stage: ruby, severity: warning, description: "A pinned instance has the fingerprint of a diagnosis instance of the same skill." }
  E-HINTS: { stage: ruby, severity: error, description: "A practice instance has no effective hints, or hints on a non-practice item." }
  E-HINT-KEY: { stage: ruby, severity: error, description: "A hint carries the instance key (A2.4 rule)." }
  W-HINT-OPTION: { stage: ruby, severity: warning, description: "A choice hint names the key option." }
  E-PRACTICE-POOL: { stage: ruby, severity: error, description: "A static practice item has fewer than practice.min_static_instances instances." }
  W-PRACTICE-CODE-SPARSE: { stage: ruby, severity: warning, description: "A catalogue code is carried by fewer than practice.min_instances_per_code instances of the item." }
  E-BLUEPRINT-PRACTICE-ITEM: { stage: blueprint, severity: error, description: "A blueprint pins a practice item." }
  E-REVIEW-CHECKLIST: { stage: review, severity: error, description: "A review of a practice item must have exactly 13 checklist points, a review of a lesson/1 revision exactly 8, a review of a lesson/2 revision exactly 11, any other review exactly 11." }
  # Free pages, release 2 (D-290, SPEC B7): the static codes are raised at submit (Validation::PageChecks), the chrome ones by the
  # validation in the server's Chrome (Validation::PageRunner), E-LESSON-FREEPAGE by the lesson that embeds a page.
  E-PAGE-FILES: { stage: ruby, severity: error, description: "A page bundle has a file outside the allowlist (page.json, main.mjs, at most 8 more .mjs, one style.css, assets/*.svg|png|webp|jpg), no main.mjs, a path that is not plain, or a binary that is not what its extension says." }
  E-PAGE-SIZE: { stage: ruby, severity: error, description: "A page bundle is over a budget of the page rules: 1 MB raw or 300 KB gzip in all, 300 KB for an asset, 200 KB for a module." }
  E-PAGE-LIBS: { stage: ruby, severity: error, description: "A page declares a library the server does not vendor, or imports one it did not declare." }
  E-PAGE-TEXT: { stage: ruby, severity: error, description: "A text of the page manifest breaks its word count (instructions at most 40, alt 5 to 60, fallback 10 to 80) or the readability rules, or the manifest key differs from the page or the subject." }
  E-PAGE-CSS: { stage: ruby, severity: error, description: "style.css has an @import or a url() that is not a file of the bundle." }
  E-PAGE-API: { stage: ruby, severity: error, description: "The page code uses a global, a property, a call or a string the page rules refuse (window.parent, fetch, Date, innerHTML, an absolute URL, createElement of an iframe ...), or called a stubbed API in Chrome." }
  E-PAGE-IMPORT: { stage: ruby, severity: error, description: "A page module imports something other than a relative file of the bundle, banco, or a declared library, or uses import()." }
  E-PAGE-HYGIENE: { stage: ruby, severity: error, description: "A text file of a page carries one of the private hygiene terms." }
  W-PAGE-KEY: { stage: ruby, severity: warning, description: "A string of the page equals a key text of the topic's pinned practice instances or a final of the lesson's try exercises." }
  W-PAGE-REPEAT: { stage: ruby, severity: warning, description: "The caption of a page block and the page's instructions_it say nearly the same thing: the student reads it twice. Say it once, or make the caption about the idea and the instructions about the action." }
  E-PAGE-READY: { stage: chrome, severity: error, description: "The page did not send ready within 3 seconds at 4x CPU throttling." }
  E-PAGE-ERROR: { stage: chrome, severity: error, description: "An uncaught error, a rejected promise or a console error in the page, on some seed or in the scripted session." }
  E-PAGE-NETWORK: { stage: chrome, severity: error, description: "A CSP violation (any network attempt shows here) or a request outside the bundle, the kit and the declared libraries." }
  E-PAGE-NAVIGATION: { stage: chrome, severity: error, description: "The frame navigated: a second load event." }
  E-PAGE-A11Y: { stage: chrome, severity: error, description: "axe found a serious or critical violation, the canvas has no text alternative, or a control cannot be reached with Tab, has no visible focus or no name." }
  W-PAGE-A11Y: { stage: chrome, severity: warning, description: "axe found a moderate or minor violation." }
  E-PAGE-MOTION: { stage: chrome, severity: error, description: "Under reduced motion two screenshots one second apart differ." }
  E-PAGE-NO-FALLBACK: { stage: chrome, severity: error, description: "With WebGL stubbed to null the page threw or did not show its fallback text." }
  W-PAGE-NONDETERMINISTIC: { stage: chrome, severity: warning, description: "Two loads with the same seed gave different ready screenshots." }
  W-PAGE-LONGTASK: { stage: chrome, severity: warning, description: "A task over 200 ms after ready." }
  W-PAGE-FPS: { stage: chrome, severity: warning, description: "Under 30 frames per second at 4x throttling while animating." }
  W-PAGE-IDLE-LOOP: { stage: chrome, severity: warning, description: "Frames were still rendered 2 seconds after the last interaction." }
  E-PAGE-MEMORY: { stage: chrome, severity: error, description: "The page's JavaScript heap passed 150 MB." }
  E-LESSON-FREEPAGE: { stage: ruby, severity: error, description: "A page block pins a page revision that does not exist, has not passed validation, belongs to another subject, is a fourth page in a lesson (at most 2), or sits in a core card." }
  # Grading proposals (the evening loop).
  E-GRADE-POINT: { stage: grading, severity: error, description: "A grade proposal has an unknown or missing rubric point, or a score that is not an integer between 0 and the weight." }
  E-GRADE-QUOTE: { stage: grading, severity: error, description: "A score above 0 has no quote, or the quote is shorter than 3 or longer than 300 characters." }
  E-GRADER-IS-AUTHOR: { stage: grading, severity: error, description: "The grading session is among the item's authoring sessions (also reported as reason grader_is_author)." }
  quote_not_in_submission: { stage: grading, severity: error, description: "The brief's name for E-QUOTE-NOT-FOUND on a grade proposal (the API sends E-QUOTE-NOT-FOUND with this as reason)." }
  grader_is_author: { stage: grading, severity: error, description: "The grading session is among the item's authoring sessions." }

# Refusals that store nothing (only for non-revisions), and the API's own codes.
api:
  E-AUTH: { http: 401, description: "Token missing, invalid or revoked." }
  E-STALE-BASE: { http: 409, description: "The submission is not based on the latest revision." }
  E-CHROME-BUSY: { http: 409, description: "Chrome is busy; retry in 30 s." }
  E-CHROME-UNAVAILABLE: { http: 503, description: "Chrome or the grader worker did not answer (a dry run), or could not draw the figures of an item for `solve open` and `review open`; retry in 30 s." }
  E-FILES: { http: 422, description: "Unparseable or missing files." }
  E-TOO-LARGE: { http: 413, description: "A file is over 64 KB or the total over 2 MB." }
  E-NOT-FOUND: { http: 404, description: "Unknown item, subject, brief, revision or graph revision." }
  E-BRIEF-UNKNOWN: { http: 404, description: "No brief with that name." }
  E-SIMULATE-INPUT: { http: 422, description: "The simulation input is not a usable blueprint, bundle or script." }
  E-BLUEPRINT-UNKNOWN: { http: 404, description: "The subject has no blueprint revision." }
  E-SESSION: { http: 422, description: "A command that needs a session sent no X-Banco-Session, or the session does not exist (banco session new)." }
  E-SESSION-ROLE: { http: 422, description: "The session has another role than the command needs." }
  E-PROPOSAL-EXISTS: { http: 409, description: "The attempt already has a grade proposal the teacher has neither confirmed nor rejected." }

# What the grader says about one answer (attempt_gradings.verdict).
verdicts:
  correct: { evidence: C }
  typical_error: { evidence: W, note: "carries the catalogue code" }
  wrong: { evidence: W, note: "certain but unclassified" }
  dont_know: { evidence: D }
  wrong_form: { evidence: conditional, note: "W when the form is the item's skill; WRONG_FORM_DECLARED when declared; pending otherwise" }
  near_miss: { evidence: conditional, note: "NEAR_MISS" }
  nearly_correct: { evidence: C, note: "a matching with all pairs right but one (D-301), never with a right column of two options nor an answer that gives one option to every row (D-314); normalized carries off_pair" }
  undetermined: { evidence: pending }
  invalid: { evidence: none, note: "not an attempt; Italian message; app_event invalid_input" }

# Codes the grader emits besides catalogue codes (snake_case). The orthography
# allowlist of Rules::V1 is a subset of these.
grader_codes:
  es_accents: { description: "Spanish accent missing or misplaced; value otherwise right." }
  it_accents: { description: "Accent missing or wrong; value otherwise right. Any subject except Spanish uses this one code (English included); the name is historical (D-108)." }
  it_apostrophe_accent: { description: "Apostrophe typed instead of an accent (perche' for perché)." }
  radical_simplified: { description: "The radical is not in simplest form (wrong_form)." }
  common_factor_not_cancelled: { description: "An algebraic fraction whose numerator and denominator still share a factor (wrong_form of the reduced form)." }
  lowest_terms: { description: "The fraction is not in lowest terms (wrong_form)." }
  improper: { description: "An improper fraction where a mixed number is declared (wrong_form)." }
  mixed: { description: "A mixed number where an improper fraction is declared (wrong_form)." }
  scientific_notation: { description: "A number with the right value that is not written as a·10^n with 1 <= a < 10 where the item declares form scientific (wrong_form)." }
  use_comma: { description: "invalid: a dot where the decimal comma is required." }
  thousands_separator: { description: "invalid: a number written with the Italian thousands dot (5.300,00); the student is told to write it without." }
  empty: { description: "invalid: blank answer or empty box." }
  unparseable: { description: "invalid: the answer cannot be read." }
  unreadable_number: { description: "invalid: a number answer that cannot be read; the student is told to write only the number (D-295)." }
  unreadable_fraction: { description: "invalid: a fraction box that cannot be read; the student is told how to write a fraction (D-295)." }
  spaces_in_code: { description: "invalid: a bit string or letter code typed with spaces between its characters (D-114)." }
  ambiguous_exponent: { description: "invalid: an exponent that cannot be read with certainty." }
  ambiguous_mixed_number: { description: "invalid: a mixed number or digits separated by a space." }
  zero_denominator: { description: "invalid: denominator 0." }
  number_too_large: { description: "invalid: a number written with an exponent beyond 400." }
  invalid_answer: { description: "undetermined row: a retried answer that the checker found invalid; the teacher reads it (D-069)." }
  negative_denominator: { description: "invalid: a negative denominator (the sign goes in front of the numerator)." }
  signed_fraction_part: { description: "invalid: a mixed number whose fractional part is negative (the sign belongs to the whole part)." }
  leading_zeros: { description: "A binary answer with the right value but without the required leading zeros (wrong_form)." }
  grader_unavailable: { description: "The expression worker did not answer after the last retry; the attempt is verdict_pending for the teacher." }
