  E-LESSON-CODE-SIZE: { stage: ruby, severity: error, description: "A code block that is empty, or whose program (text) has more than lesson2.types.code.lines lines or a line over line_chars characters, whose output has more than output_lines lines or a line over line_chars, or whose input_it has more than input_lines entries or an entry over input_chars characters (D-329)." }
  E-LESSON-CODE-TAB: { stage: ruby, severity: error, description: "A tab character in the text or the output of a code block: indent with four spaces, so that the box and the copy keep the layout (D-329)." }
