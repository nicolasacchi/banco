  W-LANG-SPAN-REDUNDANT: { stage: ruby, severity: warning, description: "A [[en:..]] or [[es:..]] span inside a text that is already all in that language, unless it marks a quoted unit the lesson then discusses." }
  W-TOPIC-LANG-MIXED: { stage: ruby, severity: warning, description: "A topic of english or spanish whose lesson, pinned items, title or intro are not all bilingual; an error after course.bilingual_required_from." }
  W-LANG-FRAME-BLANK: { stage: ruby, severity: warning, description: "A bilingual typed-answer instance whose shown stems hold a second line with ___ that Grading::Frame does not read as the instruction (in place of ___, en lugar de ___, al posto di ___): the whole-sentence acceptance (D-339, D-352) is off for it (D-402)." }
