  E-LANG-PAIR-CONFLICT: { stage: ruby, severity: error, description: "Two equal target-language strings in one block have different Italian translations (the lesson's translation table is keyed by the target string)." }
  W-LANG-PAIR-CONFLICT: { stage: ruby, severity: warning, description: "The same short target-language label (3 words or fewer) has two Italian translations in one block; the translation table keeps the first, so the second is never shown (a longer text is E-LANG-PAIR-CONFLICT)." }
