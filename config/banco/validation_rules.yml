# Thresholds of mechanical validation (A-06). The version is stored with every
# validation (item_validations.rules_version); a change to a number bumps it.
# v2: fingerprints ignore the stored order and ids of options, elements, columns (D-089).
# v4: DDT (documento di trasporto, in the programme) joins caps_allowlist (D-104).
# v5: target_language_subjects and keys skip the Italian lint (D-112).
# v6: ASCII, RGB, USB, SSD, HDD, LAN, WAN, BIOS, CSV join caps_allowlist (D-114).
# v7: the course formats (D-224..D-232): blocks course, lesson and practice. No existing number changes.
# Codes and what they mean: config/banco/error_codes.yml. Generic and synthetic:
# nothing here is about a person.
# Supports (D-216) added optional checks that only fire on the new fields: no bump.
# v8: banco.lesson/2 (D-245): block lesson2 and lesson.accept_schema1. No existing number changes.
# v9: wave 2 of the rich lessons (D-264..D-268): apparatus and target-language budgets, the reachable cap, the page budgets and
# lesson2.types, the per-type caps of the 26 new diagram types. No existing number changes.
version: 9

generator:
  seeds: 200                  # seeds 1..200 are run, in two fresh contexts
  pool: 24                    # clean seeds materialized as item_instances
  min_distinct_displays: 20   # among the pool (E-GEN-POOL)
  max_problem_ratio: 0.2      # throwing seeds over seeds (E-GEN-POOL, E-GEN-THROW)
  generate_timeout_ms: 2000   # one generate call (E-GEN-TIMEOUT)
  output_max_bytes: 16384     # canonical JSON of one output (E-GEN-SCHEMA)
  batch: 50                   # seeds per evaluate_async
  batch_timeout_seconds: 15   # a harness timeout is status error, retried
  attempts: 3                 # runs of the job before a timeout counts as E-GEN-TIMEOUT
  verify_instances: 24        # instances the rejection checks (errors, mutants) run on

roundtrip:
  random_answers: 200         # E-ACCEPTS-RANDOM: random well-formed answers, none accepted
  random_components: [number, fraction, expression]

files:
  max_file_bytes: 65536       # item.json and each .mjs (E-TOO-LARGE)
  max_total_bytes: 2097152    # a whole submission (E-TOO-LARGE)
  max_asset_bytes: 204800     # one asset (E-ASSET)

pool:
  min_instances_per_skill: 6  # distinct fingerprints across at least 2 items (E-POOL-REDO)
  min_items_per_skill: 2
  min_low_guess_instances: 3
  longest_correct_ratio: 0.6  # W-LONGEST-CORRECT: share of instances where the key is the longest
  longest_correct_min_instances: 4

readability:
  max_sentence_words: 25      # E-READ sentence_length
  max_stem_words: 60          # E-READ stem_length (the instruction)
  max_bold_spans: 3           # E-READ bold_spans
  max_bold_span_words: 4      # E-READ bold_span_length
  max_message_sentences: 2    # E-MESSAGE
  min_gulpease: 50            # W-GULPEASE (texts of at least min_gulpease_words words)
  min_gulpease_words: 25
  passage_min_gulpease: 40    # W-PASSAGE-READABILITY
  # ALL-CAPS words of 3 or more letters are errors except these acronyms.
  caps_allowlist: [IVA, PIL, DNA, RNA, ATP, USA, UE, ONU, NATO, SPQR, HTML, CSS, CPU, RAM, ROM, URL, PDF, IBAN, SMS, OK, EUR, MCD, MCM, ISBN, MM, CM, KG, ATM, DDT, ASCII, RGB, USB, SSD, HDD, LAN, WAN, BIOS, CSV]
  banned_phrases:             # E-PHRASE: exam-gaming, self-certification, personalisation
    - la risposta che cercano
    - cosa scrivere
    - se il prof
    - a lezione
    - è verificato
    - e verificato
    - tutto verificato
    - come sai bene
    - come ti ho detto
    - il tuo nome
    - la tua scuola
  absolute_words: [sempre, mai, solo, soltanto, ovunque, nessuno, tutti]   # W-ABSOLUTE
  negative_stem: ["\\bnon\\b", "\\btranne\\b", "\\beccetto\\b", "\\bnessun[oa]?\\b"]  # W-NEGATIVE-STEM
  self_cert: ["\\bho verificato\\b", "\\bgarantit[oa]\\b", "\\bcertificat[oa]\\b", "\\bsicuramente corrett[oa]\\b"]  # W-SELF-CERT
  calculator_subjects: [business, chemistry]   # W-CALCULATOR when the stem lacks the sentence
  calculator_sentence: calcolatrice
  # Subjects taught in another language: the passage and the model answer are in that
  # language under *_it keys and are not linted as Italian (D-112).
  target_language_subjects: [english, spanish]
  target_language_keys: [passage_it, model_answer_it]

# Supports (D-216). method_words: what steps_it must not teach (W-STEPS-METHOD), a word or phrase
# matched whole, lower case; "all" applies to every subject, the others to the skill's subject.
supports:
  method_words:
    all: [applica la formula, applica la regola, usa la formula, usa il metodo, con il metodo]
    math: [m.c.m, mcm, minimo comune multiplo, m.c.d, mcd, massimo comun divisore, denominatore comune, stesso denominatore,
           semplifica, riduci ai minimi termini, scomponi, raccogli, isola, cambia segno, cambia il segno,
           dall'altra parte, prodotto notevole, formula inversa, sostituisci, moltiplica in croce]
    chemistry: [bilancia, mole, formula inversa, proporzione]
    business: [formula inversa, ammortamento a quote costanti]
    italian: [analisi logica, soggetto e predicato]
    computer_science: [complemento a due, divisioni successive]

# Names the generator and verify sources must not use (E-CODE-GLOBAL). Comments and
# string literals are ignored; the identifiers are matched as whole words.
code:
  allowed_imports: ["/lib/rng.mjs", "/lib/fmt.mjs"]
  banned_identifiers:
    - performance
    - crypto
    - Intl
    - eval
    - Function
    - fetch
    - XMLHttpRequest
    - WebSocket
    - EventSource
    - importScripts
    - Worker
    - SharedWorker
    - WebAssembly
    - navigator
    - location
    - document
    - window
    - globalThis
    - localStorage
    - sessionStorage
    - indexedDB
    - sendBeacon
    - postMessage
    - Date
  banned_members:             # as a property name: x.toLocaleString()
    - toLocaleString
    - toLocaleDateString
    - toLocaleTimeString
  banned_member_calls:        # Object.member
    - [Math, random]
  banned_string_patterns:     # inside string literals: an external resource
    - "https?://"
    - "(^|[^:])//[a-z0-9.-]+\\.[a-z]{2,}"
    - "^data:"
    - "^blob:"

# The lines of the previous-year programme each subject owns (C-01), for the
# coverage check of `banco skill-graph coverage`. Line numbers only.
coverage:
  prima_source: prima-2025-26
  ranges:
    italian: [7, 31]
    history: [33, 47]
    geography: [49, 60]
    math: [62, 81]
    biology: [83, 94]
    chemistry: [95, 100]
    english: [103, 119]
    law_economics: [121, 140]
    business: [142, 151]
    computer_science: [153, 161]
    spanish: [163, 186]

# Phase 1b, course content (A2.1, A3.2). Lessons, course maps and topics are synchronous (no Chrome).
course:
  seconda_source: seconda-2025-26   # the source a course skill and a lesson cite as taught_in / needed_by

lesson:
  max_bytes: 65536
  max_words: 500              # all sections except Prova tu and Soluzioni (E-LESSON-WORDS)
  max_sentence_words: 25      # E-READ sentence_length, as Validation::Readability
  max_bold_ratio: 0.08        # bold words / all words (E-LESSON-BOLD)
  exercises: [4, 8]           # E-LESSON-EXERCISES
  summary_points: [3, 5]      # E-LESSON-SUMMARY
  why_sentences: [2, 4]       # W-LESSON-WHY
  mistakes_min: 3             # W-LESSON-MISTAKES
  min_gulpease: 50            # W-GULPEASE on idea_it and example_it
  book_line: "Pagine del libro: le indica il docente."
  book_extra_words: 30        # E-LESSON-BOOK
  page_pattern: '\b(pag\.?|pagg\.?|pagina|pagine|p\.)\s*\d'   # E-LESSON-PAGE
  review_min_recomputed_math: 8   # E-LESSON-REVIEW-RECOMPUTED
  accept_schema1: true        # a lesson/1 submit is accepted; set to false in its own commit (D-251): then E-LESSON-SCHEMA

# banco.lesson/2 (D-245..D-247): cards of typed blocks. The numbers of A3 of the spec; a change bumps the version.
lesson2:
  max_bytes: 98304            # E-LESSON-SIZE: lesson.md
  max_assets_bytes: 1572864   # E-LESSON-SIZE: all assets of a lesson (release 1.1)
  max_words: 500              # E-LESSON-WORDS: core prose (text, callout, summary, mistake, example why_it, card titles)
  max_card_words: 90          # E-CARD-WORDS: prose of one core card
  callout_words: 40           # E-CARD-WORDS
  blocks_per_card: [1, 6]     # E-CARD-BLOCKS
  core_cards: [6, 14]         # E-LESSON-CARDS
  extra_cards_max: 4          # E-LESSON-CARDS: extra cards (roles idea or example only)
  parts: [2, 6]               # E-LESSON-PARTS: none, or this many
  part_min_cards: 2           # E-LESSON-PARTS
  extra_words: 1000           # E-LESSON-EXTRA-WORDS: more blocks and extra cards together
  more_words: 150             # E-LESSON-EXTRA-WORDS: one more block
  example_steps: [2, 8]       # E-LESSON-BLOCK
  example_step_words: 30      # E-LESSON-BLOCK: do_it plus why_it of one step
  procedure_steps: [2, 6]     # E-LESSON-BLOCK
  cases: [2, 4]               # E-LESSON-BLOCK
  legend_roles: [2, 8]        # E-LESSON-BLOCK
  mistakes: [3, 8]            # W-LESSON-MISTAKES below the first number; E-LESSON-BLOCK above the second
  checks_core: [2, 8]         # E-LESSON-CHECKS: checks outside the try card, step blanks included
  checks_extra_max: 2         # E-LESSON-CHECKS: more in extra cards
  blanks_max: 3               # E-LESSON-CHECKS
  checks_gap: 3               # W-LESSON-CHECKS-SPARSE: this many idea or example cards in a row without one
  try_exercises: [4, 8]       # E-LESSON-EXERCISES
  try_checks_per_exercise: 3  # E-LESSON-CHECKS: parts a, b, c
  try_checks_max: 12          # E-LESSON-CHECKS
  visuals_core_max: 12        # E-LESSON-VISUALS: diagrams + schemas + procedures (each diagram of a cases counts)
  visuals_extra_max: 4        # E-LESSON-VISUALS
  states_max: 6               # E-LESSON-VISUALS: states of one diagram
  icon_roles_per_card: 3      # E-CARD-ROLES: roles with carrier icon in a card's running text
  summary_points: [3, 5]      # E-LESSON-SUMMARY
  summary_point_words: 20     # E-LESSON-SUMMARY
  schema_nodes: [3, 12]       # E-LESSON-MAP
  table_columns_max: 4        # E-LESSON-BLOCK (the spec's A3 says 5 for a schema table and A4 4 for the block: one rule, 4)
  table_rows_max: 10          # E-LESSON-BLOCK
  alt_words: [5, 50]          # E-LESSON-ALT
  label_words_max: 6          # E-LESSON-DIAGRAM
  node_words_max: 6           # E-LESSON-DIAGRAM: concept map node text
  edge_words_max: 3           # E-LESSON-DIAGRAM: concept map edge label
  goals_words_max: 12         # E-LESSON-BLOCK: one goal in the front matter
  book_extra_words: 30        # E-LESSON-BOOK
  why_sentences: [2, 4]       # W-LESSON-WHY
  max_sentence_words: 25      # E-READ sentence_length, per paragraph and list item
  max_bold_ratio: 0.08        # E-LESSON-BOLD: whole body
  max_bold_span_words: 4      # E-READ bold_span_length
  min_gulpease: 50            # W-GULPEASE: the whole core prose
  review_points: 11           # E-REVIEW-CHECKLIST (lesson/1 keeps 8)
  render:                     # E-LESSON-RENDER, run by R4 (the server's Chrome); an extra card only at the first core viewport
    budget_seconds: 90        # one revision
    card_viewport_seconds: 5
    core_viewports: [[390, 844, cream], [1280, 800, cream], [1280, 800, dark]]
    extra_viewports: [[390, 844, cream]]
    min_text_px: 18           # E-DIAGRAM-SMALL-TEXT: never under this, whatever the preference
  # ---- version 9 (WAVE2-COMPONENTS 1.4, 1.8)
  apparatus_words: 250               # E-LESSON-APPARATUS-WORDS: words open by default (quotations, translations, dialogue lines, reveal texts, mirror rows, document blocks, glossary definitions), on top of max_words
  closed_original_words: 240         # E-LESSON-APPARATUS-WORDS: originals closed by default (4 parts x 60)
  card_source_only_visual_max: 3     # E-CARD-NO-VISUAL: cards whose only visual is a `source`
  one_per_card: [source, dialogue, reveal_options, oral]   # E-CARD-BLOCKS: at most one of each in a card
  target_sentence_words: 12          # E-READ (target-language set): a sentence, a dialogue line, a tile line, a listen text, a mirror row
  tense_mark_words: 8                # E-READ: a timeline tense mark
  target_vocabulary_top: 3000        # W-LANG-LEVEL: words outside an open frequency list of the first 3000 (licence checked by T2)
  glossary_terms_max: 12             # E-LESSON-BLOCK
  reachable_cap: 500                 # E-DIAGRAM-REACHABLE-CAP: values a figure on a card with a check can show within its declared ranges
  select_target_px: 24               # E-DIAGRAM-TARGET: at 390 px
  images_per_lesson_max: 2           # E-LESSON-BLOCK (image, W2-2)
  image_bytes_max: 307200            # E-LESSON-SIZE (image)
  budgets:                           # CI measures, not Ruby checks
    js_gzip_kb_per_lesson: 120       # renderer core plus the types a lesson uses
    map_base_gzip_kb: 60
    data_module_gzip_kb: 20
    time_to_interactive_seconds: 3   # the heaviest lessons, 4x CPU throttling, 1.6 Mbps
    layout_ms_map: 50                # `map` layout at 4x throttling
  # Per-type caps (V4): the numbers of the plan's schemas that JSON Schema cannot hold per effective state, checked by the type's
  # Ruby module (E-LESSON-DIAGRAM unless the type says otherwise). W2-2 types are provisional until their family's first look.
  types:
    network: {nodes: [2, 8], edges_per_state: 12, label_words: 6, note_words: 25, badge_words: 4}
    chain: {nodes: [3, 10], node_words: 8, not_causal_links: 2, back_links: 1}
    flow_line: {stations: 8, branch_stations: 4, returns: 3, station_words: [2, 4]}
    nested: {levels: [3, 6]}
    timeline: {lanes: [1, 3], periods_per_state: 6, events_per_state: 12, marks: [1, 8], tense_mark_words: 8, spans: 4}
    map: {highlight_per_state: 8, points: 12, arrows: 6, routes: 3, labels_drawn: 8, candidates: 12}
    insolation: {latitudes: 4}
    cross_section: {points: 16, features: 8, belts: 6}
    climograph: {months: 12, temp_range: [-60, 45], precip_range: [0, 1500]}
    bar_model: {bars: 4, parts: 8, marks: 6, chain: 3, fractions: 4}
    seats: {seats: 1000, groups: 8}
    chart: {categories: 12, series: 4, curves: 2}
    scale: {objects: [2, 8], ratio_drawn_max: 200, decades: 9, label_words: 6}
    periodic_table: {highlight_groups: 4}
    register: {width: [1, 16], ring_bits: [3, 4], states: 6}
    column_calc: {width: [1, 16], multiplier_digits: 4}
    paradigm: {groups: [1, 3], verbs: 10}
    word_parts: {words: [1, 4], parts: 4}
    mirror: {rows: [1, 3], words_per_side: 12}
    document: {lines: 6, discounts: 4, costs: 4, blocks: 10, block_words_total: 150, endorsements: 4}
    formula: {formulas: [1, 3], atoms_drawn: 30, coefficient: [2, 20], subscript: [2, 99]}
    molecule: {items: [1, 6]}
    strand: {positions: [1, 12]}
    particles: {boxes: [1, 4], particles_per_box: 30}
    phase_changes: {}
    cell: {cells: [1, 2], paths_per_state: 3}
    program: {statements: 12, depth: 2, variables: 6, executed_blocks: 200, trace_rows: 12, value_abs_max: 1000000, try_chips: 6}
    source: {parts: [1, 4], part_words: 60, guide_spans: 6}
    reveal: {answer_words: 40, option_then_words: 25, options: [2, 4]}
    oral: {outline: [3, 7], model_words: 120}
    dialogue: {lines: [2, 12], line_words: 12, speakers: [1, 3], speaker_name_chars: 12}
    image: {text_words: 60, hotspots: 8}

# Free pages, release 2 (D-281, SPEC B2, B7). Independent of the rules version above: a page revision stores the version at submit.
page:
  max_total_bytes: 1048576          # E-PAGE-SIZE: the agent's files, raw
  max_gzip_bytes: 307200            # E-PAGE-SIZE: the agent's files, gzip
  max_asset_bytes: 307200
  max_module_bytes: 204800
  max_extra_modules: 8              # E-PAGE-FILES: modules besides main.mjs
  max_pages_per_lesson: 2           # E-LESSON-FREEPAGE
  words: {instructions_max: 40, alt: [5, 60], fallback: [10, 80]}   # E-PAGE-TEXT
  scan:                             # E-PAGE-API: the `pages` rule set of Validation::JsScan (allowlist on window and document, denylist on the rest)
    window_allow: [addEventListener, removeEventListener, innerWidth, innerHeight, devicePixelRatio, matchMedia, requestAnimationFrame, cancelAnimationFrame, getComputedStyle]
    document_allow: [createElement, createElementNS, createTextNode, getElementById, querySelector, querySelectorAll, body, documentElement, activeElement, addEventListener, removeEventListener]
    banned_identifiers: [globalThis, self, top, parent, opener, frames, fetch, XMLHttpRequest, WebSocket, EventSource, Worker, SharedWorker, importScripts, eval, Function,
                         Date, performance, navigator, localStorage, sessionStorage, indexedDB, caches, RTCPeerConnection, webkitRTCPeerConnection, RTCDataChannel,
                         BroadcastChannel, postMessage, Image, Audio, WebAssembly, crypto]
    banned_properties: [defaultView, contentWindow, contentDocument, ownerDocument, opener, cookie, domain, sendBeacon, serviceWorker, ping, srcdoc, innerHTML, outerHTML, insertAdjacentHTML]
    banned_strings: [prefetch, preconnect, dns-prefetch, prerender, modulepreload, iframe, link, base, meta, script, form, a]
  validate:                         # the Chrome checks (Validation::PageRunner)
    ready_ms: 3000                  # E-PAGE-READY at throttle x CPU
    throttle: 4
    heap_mb: 150                    # E-PAGE-MEMORY
    longtask_ms: 200                # W-PAGE-LONGTASK
    min_fps: 30                     # W-PAGE-FPS
    idle_ms: 2000                   # W-PAGE-IDLE-LOOP
    session_actions: 60             # the scripted session
    session_shots: [20, 40, 60]
    full_seeds: [0, 1]              # indices into Pages::SEEDS that run every step; the others run ready, errors and network
    budget_seconds: 420             # one revision
    load_seconds: 30
    viewports: {wide: [1280, 800], narrow: [390, 844]}
    shot_quality: 80

practice:                     # practice items (A2.4) and topics (A2.3)
  hints: [2, 4]
  min_static_instances: 10                  # E-PRACTICE-POOL
  topic_min_instances_per_skill: 20         # E-TOPIC-POOL: distinct fingerprints
  topic_min_low_guess_instances_per_skill: 12
  min_instances_per_code: 3                 # W-PRACTICE-CODE-SPARSE
