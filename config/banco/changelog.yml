# «Novità» (D-375): what a student or a teacher can see that is new, written by hand, one entry per change, in the same commit as the change.
# Checked by Changelog::Entries (test/models/changelog/entries_test.rb). Nothing of it is made by a model: every word is read here.
#
#   id         unique, lower case words and hyphens
#   date       the day the change went live
#   audience   student, teacher or both: who reads it (the teacher's page lists every entry)
#   kind       software (the app), content (lessons, exercises) or fix (a mistake of ours)
#   title_it, body_it   Italian: a short title and 1 to 3 short sentences in plain words, what is new for the reader, never what was wrong with him
#   title_en, body_en   the English twin, required when the audience includes the student (the student may read the app in English)
#   decisions  optional: the decisions of docs/decisions.md behind it, shown to the teacher only
#   topics     optional: the keys of the topics it is about
#   link       optional: a page of the app, for example /schemas
#
# The student's text has no decision number and no jargon; it is second person and never blames. Newest first is the order of the pages, not of this file.
entries:
  - id: comment-send-once
    date: 2026-11-23
    audience: [student]
    kind: fix
    decisions: [D-388]
    title_it: "Commenti: un solo invio"
    body_it: "Quando premi Invia, il pulsante resta spento finché il commento non è partito. Poi il riquadro si chiude e vedi «Inviato al docente». Se non parte, il testo resta lì e puoi riprovare."
    title_en: "Comments: sent once"
    body_en: "When you press Send, the button stays off until the comment has gone. Then the box closes and you see «Sent to the teacher». If it does not go, your text stays there and you can try again."
  - id: number-answers-with-unit
    date: 2026-11-23
    audience: [student]
    kind: fix
    decisions: [D-386]
    title_it: "Risposte con l'unità di misura: ora vanno bene"
    body_it: "Se scrivi «2 minuti» e l'esercizio parla di minuti, la risposta conta come giusta, con un promemoria: basta il numero. Se la risposta non si può leggere, ora vedi subito quale parola togliere, e puoi riprovare."
    title_en: "Answers with the unit of measure are now accepted"
    body_en: "If you write «2 minutes» and the exercise is about minutes, the answer counts as right, with a reminder that only the number is needed. If an answer cannot be read, you now see at once which word to take out, and you can try again."

  - id: flowchart-phone-arrows
    date: 2026-11-19
    audience: [student]
    kind: software
    decisions: [D-383]
    title_it: "Schemi di flusso sul telefono: una freccia per ogni risposta"
    body_it: "Sul telefono gli schemi con una domanda ora hanno una freccia per ogni risposta, che parte dal rombo e arriva al riquadro giusto. Così si vede bene dove porta il Sì e dove porta il No."
    title_en: "Flowcharts on the phone: one arrow for each answer"
    body_en: "On the phone, flowcharts with a question now have one arrow for each answer, from the diamond to the right box. You can see where Yes goes and where No goes."

  - id: flowchart-diamond-and-loop
    date: 2026-11-19
    audience: [student]
    kind: software
    decisions: [D-383]
    title_it: "Schemi di flusso: il rombo e la freccia che torna indietro"
    body_it: "Negli schemi di flusso la domanda ora è un vero rombo. Quando una parte si ripete, come in un ciclo, una freccia torna su alla domanda, con la sua etichetta."
    title_en: "Flowcharts: the diamond and the arrow that goes back"
    body_en: "In flowcharts the question is now a real diamond. When a part repeats, as in a loop, an arrow goes back up to the question, with its label."

  - id: text-sizes-and-themes
    date: 2026-11-17
    audience: [student]
    kind: software
    decisions: [D-350]
    link: /settings
    title_it: "Testo più grande o più piccolo, e i temi"
    body_it: "In Impostazioni scegli quanto è grande il testo: tutta la pagina si adatta. Puoi anche scegliere il tema: Crema, Chiaro, Scuro o Automatico."
    title_en: "Bigger or smaller text, and themes"
    body_en: "In Settings you choose how big the text is, and the whole page follows. You can also choose the theme: Cream, Light, Dark or Automatic."

  - id: today-entry-test-list
    date: 2026-11-17
    audience: [student]
    kind: software
    decisions: [D-351]
    link: /today
    title_it: "Oggi mostra solo i test d'ingresso da fare"
    body_it: "Le materie già fatte stanno in una riga sola. Da lì puoi vedere i risultati."
    title_en: "Today shows only the entry tests still to do"
    body_en: "The subjects you have already done are on one line. From there you can see your results."

  - id: whole-sentence-answers
    date: 2026-11-18
    audience: [student]
    kind: fix
    decisions: [D-352]
    title_it: "Puoi rispondere con la frase intera"
    body_it: "Negli esercizi con uno spazio da riempire puoi scrivere tutta la frase. Maiuscole, punteggiatura e apostrofi non contano."
    title_en: "You can answer with the whole sentence"
    body_en: "In fill-in exercises you can write the whole sentence. Capital letters, punctuation and apostrophes do not matter."

  - id: teacher-resolves-practice-try
    date: 2026-11-18
    audience: [teacher]
    kind: software
    decisions: [D-352]
    title_it: "Puoi segnare giusto un tentativo degli esercizi"
    body_it: "Se un tentativo negli esercizi era giusto, lo segni giusto con una decisione. L'esercizio si chiude con quel tentativo e quelli dopo non contano."

  - id: exercise-list-says-what-happened
    date: 2026-11-18
    audience: [student]
    kind: software
    decisions: [D-353]
    title_it: "L'elenco degli esercizi è più chiaro"
    body_it: "«Finito: con la soluzione» compare solo se hai chiesto la soluzione. Gli esercizi fatti vanno in «Già fatti», in fondo. Se mandi due volte la stessa risposta, te lo diciamo e non conta come tentativo."
    title_en: "The exercise list is clearer"
    body_en: "«Finished: with the solution» appears only if you asked for the solution. Exercises you have done go into «Already done», at the bottom. If you send the same answer twice, we tell you and it does not count as a try."

  - id: settings-apply-on-click
    date: 2026-11-18
    audience: [student]
    kind: software
    decisions: [D-354]
    link: /settings
    title_it: "Le impostazioni valgono subito"
    body_it: "Quando tocchi una scelta in Impostazioni, vale subito e resta salvata. Non serve più «Salva». Ci sono anche due misure del testo più piccole: «Piccolissimo» e «Minimo»."
    title_en: "Settings apply at once"
    body_en: "When you tap a choice in Settings, it applies at once and stays saved. You no longer need «Save». There are also two smaller text sizes: «Tiniest» and «Minimum»."

  - id: back-button
    date: 2026-11-18
    audience: [student]
    kind: fix
    decisions: [D-355]
    title_it: "Il tasto indietro funziona meglio"
    body_it: "Tornando indietro vedi la pagina aggiornata con quello che hai appena fatto. Nelle lezioni a schede, indietro ti porta alla scheda di prima. Alla fine di un test, indietro ti porta a Oggi."
    title_en: "The back button works better"
    body_en: "When you go back, the page shows what you have just done. In lessons with cards, back takes you to the card before. At the end of a test, back takes you to Today."

  - id: english-interface
    date: 2026-11-18
    audience: [student]
    kind: software
    decisions: [D-356, D-364]
    link: /settings
    title_it: "Puoi usare l'app in inglese"
    body_it: "In Impostazioni, sotto «Lingua dell'app», scegli Italiano o English. Menu, pulsanti e messaggi cambiano; lezioni ed esercizi restano in italiano."
    title_en: "You can use the app in English"
    body_en: "In Settings, under «App language», choose Italiano or English. Menus, buttons and messages change; lessons and exercises stay in Italian."

  - id: privacy-and-account-pages
    date: 2026-11-18
    audience: [student, teacher]
    kind: software
    decisions: [D-357]
    link: /privacy
    title_it: "Privacy e Account"
    body_it: "Nella pagina Privacy leggi come usiamo i dati. Nella pagina Account trovi come funziona l'accesso e come cambiare la password."
    title_en: "Privacy and Account"
    body_en: "On the Privacy page you read how we use data. On the Account page you find how signing in works and how to change your password."

  - id: reminder-before-answering
    date: 2026-11-18
    audience: [student]
    kind: software
    decisions: [D-358]
    title_it: "«Ricorda:» prima di rispondere"
    body_it: "Se in un tipo di esercizio ti capita più volte lo stesso errore, sopra la risposta trovi una riga «Ricorda:». Ti ricorda la regola, mai la risposta. Non è un aiuto e non cambia i tuoi progressi."
    title_en: "«Remember:» before you answer"
    body_en: "If you make the same mistake more than once in a type of exercise, a «Remember:» line appears above the answer. It reminds you of the rule, never the answer. It is not a hint and does not change your progress."

  - id: listen-recorded-voices
    date: 2026-11-18
    audience: [student]
    kind: software
    decisions: [D-359]
    link: /settings
    title_it: "«Ascolta» ha voci nuove"
    body_it: "Le lezioni si ascoltano con voci registrate prima, uguali su ogni telefono. Se per una frase non c'è la voce registrata, si usa quella del telefono."
    title_en: "«Listen» has new voices"
    body_en: "Lessons are read aloud with voices recorded ahead of time, the same on every phone. If a sentence has no recorded voice, your phone's own voice is used."

  - id: teacher-audio-count
    date: 2026-11-18
    audience: [teacher]
    kind: software
    decisions: [D-359]
    title_it: "Nella pagina dell'argomento vedi quante frasi hanno la voce"
    body_it: "Sotto la lezione c'è «Audio: N di M frasi pronte». Le voci si fanno prima, una volta per ogni revisione della lezione, mai quando lo studente ascolta."

  - id: download-my-data
    date: 2026-11-18
    audience: [student]
    kind: software
    decisions: [D-360]
    link: /privacy
    title_it: "Scarica i miei dati"
    body_it: "Nella pagina Privacy c'è «Scarica i miei dati»: un solo file zip con tutto quello che l'app sa di te. Dentro trovi anche un riepilogo facile da leggere."
    title_en: "Download my data"
    body_en: "On the Privacy page there is «Download my data»: one zip file with everything the app knows about you. Inside there is also a summary that is easy to read."

  - id: teacher-student-data
    date: 2026-11-18
    audience: [teacher]
    kind: software
    decisions: [D-360]
    link: /teacher/students
    title_it: "Puoi scaricare i dati dello studente"
    body_it: "Nella pagina Studenti scarichi lo stesso file zip che scarica lo studente, con tutto quello che l'app ha di lui. Un ospite non può scaricarlo."

  - id: longer-comments-everywhere
    date: 2026-11-18
    audience: [student]
    kind: fix
    decisions: [D-361]
    title_it: "Commenti più lunghi, da ogni pagina"
    body_it: "Un commento e le tue risposte al docente possono arrivare a 2000 caratteri. «Commenta» funziona da ogni pagina, anche in Educazione civica e quando una pagina non si trova."
    title_en: "Longer comments, from every page"
    body_en: "A comment and your replies to the teacher can be up to 2000 characters. «Comment» works from every page, including Civic education and when a page cannot be found."

  - id: math-answers-in-full
    date: 2026-11-18
    audience: [student]
    kind: fix
    decisions: [D-362]
    title_it: "Puoi scrivere la risposta come equazione intera"
    body_it: "Per esempio x = 37/5 al posto di 37/5. Conta il valore: se è giusto, la risposta è giusta."
    title_en: "You can write the answer as a whole equation"
    body_en: "For example x = 37/5 instead of 37/5. The value is what counts: if it is right, the answer is right."

  - id: rows-count-after-a-try
    date: 2026-11-18
    audience: [student]
    kind: software
    decisions: [D-363]
    title_it: "«Giuste: N su M» dopo un tentativo"
    body_it: "Dopo un abbinamento, un vero o falso o un ordine non ancora giusto, vedi quante righe sono giuste, per esempio «Giuste: 3 su 5». Non ti diciamo quali, così puoi ragionarci."
    title_en: "«Right: N of M» after a try"
    body_en: "After a matching, a true or false or an ordering that is not right yet, you see how many rows are right, for example «Right: 3 of 5». We do not say which ones, so you can work it out."

  - id: stars-and-comments
    date: 2026-11-18
    audience: [student]
    kind: software
    decisions: [D-365]
    title_it: "Stelle e commenti su esercizi e lezioni"
    body_it: "Quando un esercizio è finito, e in ogni lezione, puoi dare da 1 a 5 stelle e scrivere un commento. Sono facoltativi e non cambiano i tuoi progressi."
    title_en: "Stars and comments on exercises and lessons"
    body_en: "When an exercise is over, and in every lesson, you can give 1 to 5 stars and write a comment. They are optional and do not change your progress."

  - id: teacher-ratings-page
    date: 2026-11-18
    audience: [teacher]
    kind: software
    decisions: [D-365]
    link: /teacher/ratings
    title_it: "Valutazioni: le stelle dello studente"
    body_it: "Nella pagina Valutazioni leggi le stelle e i commenti dello studente su esercizi e lezioni, con la media. Sono solo da leggere: niente risposta e niente decisioni."

  - id: topic-done-screen
    date: 2026-11-19
    audience: [student]
    kind: software
    decisions: [D-366]
    title_it: "«Hai finito questo argomento!»"
    body_it: "Quando hai mostrato tutto di un argomento, una schermata te lo dice e ti propone quello dopo. Dopo ogni risposta giusta senza aiuto, l'esercizio cambia."
    title_en: "«You have finished this topic!»"
    body_en: "When you have shown everything in a topic, a screen tells you and suggests the next one. After each right answer without help, the exercise changes."

  - id: already-knew-and-hours
    date: 2026-11-19
    audience: [student, teacher]
    kind: software
    decisions: [D-367]
    link: /today
    title_it: "«Già sapevi» e le ore che mancano"
    body_it: "I progressi separano gli argomenti «Già sapevi» (li hai mostrati nel test d'ingresso) da quelli «Fatti con gli esercizi». Le ore che mancano sono tonde, per esempio «circa 150 ore»."
    title_en: "«Already known» and the hours left"
    body_en: "Your progress separates the topics «Already known» (you showed them in the entry test) from those «Done with the exercises». The hours left are round, for example «about 150 hours»."

  - id: teacher-grading-review
    date: 2026-11-19
    audience: [teacher]
    kind: software
    decisions: [D-368]
    link: /teacher/grading
    title_it: "Contestazioni: dove la correzione può sbagliare"
    body_it: "La pagina Contestazioni mostra gli esercizi dove il correttore può sbagliare, prima che lo studente lo dica. Per ogni tentativo non giusto vedi i segnali: frase intera, testo quasi giusto, risposta ripetuta, «Fai controllare»."

  - id: teacher-health-and-backups
    date: 2026-11-19
    audience: [teacher]
    kind: software
    decisions: [D-369]
    title_it: "Salute e backup"
    body_it: "Il controllo di salute dice quanto è vecchio l'ultimo backup e segnala se è più di 36 ore. Elenca anche i lavori falliti nelle ultime 24 ore, con una riga «Da fare adesso»."

  - id: shorter-matchings
    date: 2026-11-19
    audience: [student]
    kind: content
    decisions: [D-370]
    title_it: "Abbinamenti più corti"
    body_it: "Gli abbinamenti nuovi hanno al massimo 4 righe, così la lista è più breve da affrontare. Quelli che ci sono già cambiano quando li rivediamo."
    title_en: "Shorter matchings"
    body_en: "New matching exercises have at most 4 rows, so the list is shorter to work through. The ones already there change when we review them."

  - id: teacher-matching-rows
    date: 2026-11-19
    audience: [teacher]
    kind: content
    decisions: [D-370]
    title_it: "Abbinamenti: 4 righe al massimo"
    body_it: "Chi scrive un abbinamento riceve un avviso sopra le 4 righe e un errore sopra le 6, nelle sottomissioni nuove. La scheda dell'esercizio mostra quante righe ha."

  - id: teacher-reply-support
    date: 2026-11-19
    audience: [teacher]
    kind: software
    decisions: [D-371]
    link: /teacher/comments
    title_it: "Rispondere ai commenti, con più aiuto"
    body_it: "Per ogni commento vedi la revisione che lo studente aveva davanti, i suoi tentativi e i commenti di prima. «In scadenza» conta le 24 ore dal suo primo messaggio senza risposta, e un controllo dei toni avvisa se una risposta sembra una colpa."

  - id: my-schemas
    date: 2026-11-19
    audience: [student]
    kind: software
    decisions: [D-372]
    link: /schemas
    title_it: "I miei schemi"
    body_it: "Quando finisci un argomento si apre il suo schema, un colpo d'occhio per ricordarlo. Li trovi tutti in «I miei schemi» e li puoi stampare."
    title_en: "My summaries"
    body_en: "When you finish a topic, its summary opens: a quick look to remind you of it. You find them all in «My summaries» and you can print them."

  - id: teacher-schema-link
    date: 2026-11-19
    audience: [teacher]
    kind: software
    decisions: [D-372]
    title_it: "Lo schema di ogni argomento, come lo vede lo studente"
    body_it: "Nella pagina di un argomento c'è il link allo schema, aperto come nell'anteprima. Lo schema è la scheda di riassunto della lezione: non c'è un testo in più da scrivere."

  - id: see-the-schema
    date: 2026-11-19
    audience: [student]
    kind: software
    decisions: [D-373]
    link: /schemas
    title_it: "«Vedi lo schema» a fine argomento"
    body_it: "Nella schermata «Hai finito questo argomento!» c'è il pulsante «Vedi lo schema». Ti porta subito allo schema che si è appena aperto."
    title_en: "«See the schema» at the end of a topic"
    body_en: "On the «You have finished this topic!» screen there is a «See the schema» button. It takes you straight to the summary that has just opened."

  - id: whats-new-page
    date: 2026-11-19
    audience: [student]
    kind: software
    decisions: [D-375]
    link: /novita
    title_it: "Novità"
    body_it: "Qui leggi cosa c'è di nuovo, dal più recente. Se c'è qualcosa che non hai ancora letto, il menu ha un puntino. Se un argomento è stato rivisto dopo un tuo commento, lo trovi in «I tuoi commenti»."
    title_en: "What's new"
    body_en: "Here you read what is new, newest first. If there is something you have not read yet, the menu has a dot. If a topic was revised after one of your comments, you find it in «Your comments»."

  - id: teacher-whats-new-page
    date: 2026-11-19
    audience: [teacher]
    kind: software
    decisions: [D-375]
    link: /teacher/changelog
    title_it: "Novità: cosa legge lo studente e cosa è cambiato"
    body_it: "La pagina Novità elenca le novità per lo studente e per te, e gli argomenti approvati di nuovo con il motivo e le due revisioni. Ogni cambiamento che lo studente o il docente possono vedere aggiunge una voce a config/banco/changelog.yml, nello stesso commit."

  - id: teacher-phone-and-contestazioni
    date: 2026-11-19
    audience: [teacher]
    kind: fix
    decisions: [D-376]
    title_it: "Commenti sul telefono e Contestazioni più chiare"
    body_it: "I commenti stanno nello schermo del telefono. In Contestazioni gli esiti sono in italiano, la risposta si legge a parole e i filtri restano quando cambi studente. Le schede degli esercizi dell'argomento mostrano le righe; un ospite non apre più la pagina «Prova»."
  - id: updated-exercise-is-replaced
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-377]
    link: /today
    title_it: "Gli esercizi aggiornati ti arrivano nella versione nuova"
    body_it: "Se un argomento viene aggiornato mentre hai un esercizio aperto, non ti torna più quello vecchio: te ne diamo uno nuovo. Le risposte che avevi dato contano ancora. «Ti è piaciuto?» arriva solo a esercizio finito, sotto la correzione."
    title_en: "Updated exercises reach you in the new version"
    body_en: "If a topic is updated while you have an exercise open, the old one does not come back: you get a new one. The answers you already gave still count. «Did you like it?» comes only when the exercise is over, below the correction."
  - id: whats-new-shorter
    date: 2026-11-19
    audience: [student]
    kind: software
    decisions: [D-378]
    link: /novita
    title_it: "Novità più corta e più chiara"
    body_it: "I tuoi commenti ora sono una scheda per argomento, con quanti commenti hai scritto. Gli argomenti rivisti sono quelli degli ultimi 14 giorni: in vista quelli che hai iniziato o che vengono dopo, gli altri in una riga."
    title_en: "A shorter, clearer What's new"
    body_en: "Your comments are now one card for each topic, with how many comments you wrote. The topics revised are those of the last 14 days: the ones you started or that come next are shown, the others are in one line."

  - id: already-known-wording
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-378]
    link: /subjects
    title_it: "«Già sapevi» al posto di «Fatto» e «Dimostrata»"
    body_it: "Un argomento che il test d'ingresso ti aveva già mostrato si chiama «Già sapevi» nell'elenco, nella pagina dell'argomento e negli esercizi. Se l'argomento è fatto, l'elenco degli esercizi lo dice e gli esercizi restano facoltativi."
    title_en: "«Already known» instead of «Done» and «Shown»"
    body_en: "A topic that the entry test had already shown is called «Already known» in the list, on the topic page and in the exercises. When the topic is done, the list of exercises says so and the exercises are optional."

  - id: print-always-light
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-378]
    link: /schemas
    title_it: "Stampa chiara con ogni tema"
    body_it: "Quando stampi uno schema o una lezione, la carta esce sempre con lo sfondo chiaro e il testo scuro, anche se usi il tema Scuro."
    title_en: "Light printing with every theme"
    body_en: "When you print a summary or a lesson, the paper always comes out with a light background and dark text, even if you use the Dark theme."

  - id: settings-without-save
    date: 2026-11-19
    audience: [student]
    kind: software
    decisions: [D-378]
    link: /settings
    title_it: "Impostazioni senza «Salva», voci con un nome"
    body_it: "In Impostazioni non c'è più il pulsante «Salva»: ogni scelta vale subito. Le voci da provare hanno un nome facile da leggere, per esempio «Voce italiana — Nicola»."
    title_en: "Settings without «Save», voices with a name"
    body_en: "In Settings there is no «Save» button any more: every choice applies at once. The voices to try have a name that is easy to read, for example «Italian voice — Nicola»."

  - id: phone-reading-fixes
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-378]
    title_it: "Sul telefono: codice da scorrere, etichette e pulsanti"
    body_it: "Il codice delle lezioni si scorre di lato, e un'ombra e una barra dicono che c'è altro da leggere. «Ascolta» e «Più lento» hanno le parole anche sul telefono. Le etichette vanno a capo e non escono dalla scheda."
    title_en: "On a phone: code that scrolls, labels and buttons"
    body_en: "The code in the lessons scrolls sideways, and a shadow and a bar tell you there is more to read. «Listen» and «Slower» have their words on a phone too. Labels wrap and no longer leave their card."

  - id: page-not-found-in-your-language
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-378]
    title_it: "La pagina che non c'è parla la tua lingua"
    body_it: "Se l'indirizzo è sbagliato, la pagina «Questa pagina non c'è» ora è in italiano o in inglese, come hai scelto, e ha il menu e il pulsante «Commenta»."
    title_en: "The page that is not there speaks your language"
    body_en: "If the address is wrong, the page «This page is not there» is now in Italian or in English, as you chose, and has the menu and the «Comment» button."

  - id: exercise-list-header-and-serve-line
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-379]
    title_it: "Elenco esercizi in ordine, e una riga che sparisce a fine esercizio"
    body_it: "In cima all'elenco degli esercizi «Esercizi» e la riga accanto («Questo argomento lo sapevi già», «Argomento fatto») non si sovrappongono più: la riga va sotto se non c'è posto. La riga «Ti propongo un esercizio simile…» sparisce quando l'esercizio è finito."
    title_en: "Exercise list in order, and a line that goes when done"
    body_en: "At the top of the list of exercises, «Exercises» and the line next to it («You already knew this topic», «Topic done») no longer overlap: the line moves below when there is no room. The line «I am giving you a similar exercise…» goes away when the exercise is over."

  - id: diagram-note-fits
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-379]
    title_it: "Nei diagrammi la nota «Ora siamo qui» sta nel suo riquadro"
    body_it: "Nel diagramma di flusso la frase «Ora siamo qui: …» non esce più dal riquadro: il riquadro è largo e alto quanto serve per il testo, anche con il testo in grassetto o più grande."
    title_en: "In diagrams the note «We are here» fits its box"
    body_en: "In the flow diagram the sentence «We are here: …» no longer spills out of its box: the box is as wide and as tall as the text needs, also with bold or bigger text."

  - id: small-reading-fixes-2
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-379]
    title_it: "Piccoli ritocchi: titolo, uscita del programma, parole chiare"
    body_it: "Il titolo di fine argomento non ha più il riquadro blu. Sul telefono «Sullo schermo vedi» non tocca più il bordo. Per gli esercizi difficili ora dice perché, e «Novità» nomina i commenti solo se ci sono."
    title_en: "Small touches: title, program output, clearer words"
    body_en: "The title at the end of a topic no longer has the blue box. On a phone «On the screen you see» no longer touches the border. For the hard exercises it now says why, and «What's new» names comments only when there are some."
  - id: teacher-polish-comments-context
    date: 2026-11-19
    audience: [teacher]
    kind: software
    decisions: [D-380]
    link: /teacher/comments
    title_it: "Commenti con il contesto, e pagine in italiano"
    body_it: "Ogni commento mostra la revisione che lo studente aveva davanti, i suoi tentativi e i commenti di prima; tema e testo sono a parole. Sul telefono la barra dell'argomento scorre con il testo. «Come lo studente» al posto di «S»."

  - id: comment-context-in-words
    date: 2026-11-19
    audience: [teacher]
    kind: fix
    decisions: [D-380]
    link: /teacher/comments
    title_it: "Nel contesto dei commenti le risposte sono a parole"
    body_it: "Sotto «Contesto» la risposta dello studente è scritta come la leggeva lui, per esempio «desinare – medio», e la riga segnata dice cosa ha dato e cosa era atteso: niente più dati grezzi. Il menu dice «Prova come lo studente»."

  - id: listen-skips-the-rating-box
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-381]
    title_it: "«Ascolta» non legge più il riquadro della valutazione"
    body_it: "Quando ascolti una lezione, la voce legge la lezione e si ferma lì: non legge più il riquadro in cui dai le stelle o scrivi un commento."
    title_en: "«Listen» no longer reads the rating box"
    body_en: "When you listen to a lesson, the voice reads the lesson and stops there: it no longer reads the box where you give stars or write a comment."

  - id: exercise-opened-not-skipped
    date: 2026-11-19
    audience: [student]
    kind: fix
    decisions: [D-384]
    title_it: "Un esercizio solo aperto dice «Aperto»"
    body_it: "Nell'elenco degli esercizi, uno che hai solo aperto, senza risposte né scritto niente, ora dice «Aperto» e non più «Saltato»: non hai saltato niente. Un tocco e riprendi da dove eri."
    title_en: "An exercise you only opened says «Opened»"
    body_en: "In the exercise list, one you only opened, with no answers and nothing typed, now says «Opened» instead of «Skipped»: you skipped nothing. One tap and you pick up where you were."
