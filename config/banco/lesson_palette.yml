# Colour roles, carriers and step tags of lessons, declared once (D-246; version 2: wave 2, the nine other subjects).
# A change is a D entry and a new `version`. bin/build-palette generates app/assets/stylesheets/lesson_roles.css and
# app/javascript/lesson/palette.js from this file; test/lib/lesson_palette_test.rb checks the rules below (contrast,
# colour-blind distance, unique icons and shapes) per subject and on every mix a page can show. Generic: nothing here is
# about a person.
#
# A role has a `carrier`, how it is told apart without colour (A6):
#   glyph     the text already says it (the letter x, a digit): colour is only reinforcement
#   position  the place says it (either side of =): a background tint of the whole span
#   icon      nothing in the text says it: colour plus the role's icon before the span (and a legend)
#   tint      a passing mark: the highlighter background
#   band      the header band of a card (the subject's accent), ink text on the tint
# Colours, each for the two themes the student can choose ("cream" is also what print uses):
#   fg    the colour of text (7:1 on --bg and --surface)
#   mark  the colour of shapes, markers and strokes in diagrams (3:1 on --bg and --surface)
#   tint  a background; the ink (--text) on it keeps 7:1
# `shape` is the marker drawn with the role in diagrams (box, weight, circle, square, triangle, diamond, ring, star,
# pentagon): unique within a subject, so a diagram is readable without colour.
# No underline style is used for roles, and right and wrong use no green and no red.
#
# Version 2 (W2-D02): the CSS variables and classes are scoped by subject (--r-SUBJECT-ROLE-fg, `[data-palette="s"] .role-x`);
# `common` stays global. Further keys of a subject:
#   same_as: SUBJECT.ROLE   (on a role) the role takes that role's colours, carrier, icon and shape (same meaning, same
#                           colour across subjects); `label_it` and `question_it` may be given
#   centre_role             the role `sentence layout: centre` centres on
#   embeds: {SUBJECT: [roles]}   the roles of a home palette this subject's pages draw (a figure of a type with
#                           `x-banco-home-palette` draws in its home subject's colours); the mix of the subject's roles
#                           and these must stay distinguishable (the palette test)
# Reserved span kinds, never usable as role names: en es it la code g.
version: 2

rules:
  max_roles_per_subject: 8        # beyond `common` and `accent`
  text_contrast: 7.0              # fg against --bg and --surface, cream and dark
  graphic_contrast: 3.0           # mark against --bg and --surface
  ink_on_tint_contrast: 7.0       # --text on every tint
  # CIEDE2000 between the marks of two roles of a subject under simulated protanopia, deuteranopia and
  # tritanopia (Machado 2009, severity 1). Two roles that rely on colour alone (glyph, position) need
  # `colour`; a pair with an icon role needs `icon` (the icon, the label and the shape tell them apart
  # too). 12 for eight icon roles is not reachable with recognisable hues at 3:1 (measured best 6.6, D-246).
  cvd_min_delta_e: {colour: 12, icon: 6}

common:                           # every subject
  highlight: {label_it: "cambia", carrier: tint, tint: {cream: "#fff1a8", dark: "#5a4a05"}}
  correct: {label_it: "giusto", carrier: icon, icon: circle-check, fg: {cream: "#1c1a14", dark: "#f3ecdc"}, mark: {cream: "#1c1a14", dark: "#f3ecdc"}}
  wrong: {label_it: "non ancora", carrier: icon, icon: lightbulb, fg: {cream: "#1c1a14", dark: "#f3ecdc"}, mark: {cream: "#1c1a14", dark: "#f3ecdc"}}
  muted: {label_it: "secondario", carrier: glyph, fg: {cream: "#4a4536", dark: "#d3cbb6"}, mark: {cream: "#4a4536", dark: "#d3cbb6"}}

