      common:
        - "Quando hai finito, premi Invia."
        - "Se non sai, premi Non lo so."
      number:
        - "Scrivi solo il numero."
        - "Per i decimali usa la virgola, per esempio 0,75."
        - "Per un numero negativo metti il segno meno davanti, per esempio -5."
      number_unit:
        - "L'unità di misura è già scritta accanto alla casella. Non scriverla."
      fraction:
        - "Scrivi il numeratore nella casella sopra e il denominatore in quella sotto."
        - "Per una frazione negativa metti il segno meno nel numeratore, per esempio -3 sopra e 4 sotto."
      fraction_mixed:
        - "Se c'è la parte intera, scrivila nella sua casella."
      expression:
        - "Scrivi nel campo con la tastiera. Sotto vedi come è stata letta la tua formula."
        - "Una frazione: premi 3, poi la barra /, poi 4. Poi premi la freccia destra."
        - "Una potenza: premi x, poi ^, poi 2. Poi premi la freccia destra per uscire dall'esponente."
        - "Un prodotto: premi 3, a, ^, 2, la freccia destra, poi b."
        - "Una parentesi: premi (, a, +, b, ), poi ^ e 2."
        - "Una radice: scrivi rad e poi il numero."
        - "Un decimale: usa la virgola. Una divisione: usa i due punti, per esempio 12:4."
      choice:
        - "Scegli una sola risposta."
        - "Puoi cliccare l'opzione, oppure premere il suo numero sulla tastiera."
        - "Con le frecce ti sposti tra le opzioni."
      ordering:
        - "Metti le righe nell'ordine giusto."
        - "Con il mouse premi Su o Giù su una riga."
        - "Con la tastiera vai su una riga con Tab, poi premi Alt con la freccia su o giù."
      matching:
        - "Per ogni voce scegli una risposta dal menu."
        - "Ogni risposta si usa una volta sola. Una risposta avanza."
      matching_reuse:
        - "In questa domanda una risposta può servire per più voci."
      normalized_text:
