        - "Controlla di aver scritto tutte le lettere."
      normalized_text_accents:
        - "Per una lettera con l'accento usa i pulsanti sotto la casella."
      short_answer:
        - "Scrivi la risposta con parole tue."
        - "Usa frasi corte e complete."
        - "Il docente la legge. La vedrai corretta dopo."
      testlet:
