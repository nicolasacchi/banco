# English twin of grading.it.yml (D-356): what the grader and the practice engine say about an answer. The item's own messages stay Italian.
en:
  grading:
    messages:
      empty: "Write an answer before you continue."
      unparseable: "I can't read the answer. Check it and try again."
      unreadable_number: "Write only the number, for example −3 or 2,5."
      extra_word: "Write only the number, without «%{word}»."
      unreadable_fraction: "Write the fraction, for example −3/4."
      incomplete: "Put all the pieces in order, then check."
      incomplete_rows: "An answer is missing: choose an answer for every row, then check."
      spaces_in_code: "Write the answer in one piece, without spaces."
      use_comma: "For decimals use a comma, for example 3,5."
      thousands_separator: "Write the number without dots or spaces between the digits, for example 5300,00."
      ambiguous_exponent: "I can't tell the exponent. Write ^ and then the digits of the exponent."
      ambiguous_mixed_number: "I can't tell the number. Write a mixed number as a fraction, or use the separate boxes."
      zero_denominator: "The denominator can't be zero."
      number_too_large: "The number is too big or too small: write it another way."
      negative_denominator: "The denominator can't be negative: put the sign in front of the numerator."
      signed_fraction_part: "In a mixed number the sign goes only on the whole part."
      blank_copied: "In place of ___ write the missing words."
      not_in_frame: "Write only the words that go in place of ___."
    form:
      lowest_terms: "The fraction can still be simplified: reduce it to lowest terms."
      not_lowest_terms: "The fraction can still be simplified: reduce it to lowest terms."
      improper: "Write the fraction as a mixed number, as the task asks."
      mixed: "Write the fraction without a whole part, as the task asks."
      denominator_one: "If the denominator is 1, write only the numerator."
      sign_in_denominator: "The sign goes in front of the fraction, not on the denominator."
      not_rationalized: "The denominator must not contain roots: rationalise it."
      radicand_not_reduced: "You can still take something out of the root."
      factor_not_extracted: "You can still take a factor out of the root."
      radicand_not_multiplied: "Multiply the numbers under the same root."
      roots_not_multiplied: "Join the roots into one."
      like_radicals_not_combined: "Add the like radicals."
      like_terms_not_combined: "Add the like terms."
      coefficients_not_multiplied: "Multiply the numerical coefficients."
      common_factor_not_cancelled: "There is still a common factor to simplify."
      not_fully_factored: "The factorisation is not complete: it can be factored further."
      common_factor_not_extracted: "First take out the common factor."
      not_expanded: "Work out the products and write the result without brackets."
      monomial_not_reduced: "The monomial can still be reduced."
      zero_term: "Remove the terms equal to zero."
      trivial_root: "The root can be calculated: write the number."
      nested_root: "Reduce the roots inside other roots."
      fraction_under_root: "Don't leave a fraction under the root."
      scientific_notation: "Write the number in scientific notation."
      leading_zeros: "Also write the leading zeros that are asked for."
    pair_note: "Right, except for one pair: «%{left}» goes with «%{key}», not with «%{given}»."
    slips:
      it_accents: "Check the accents."
      es_accents: "Check the accents."
      it_apostrophe_accent: "Check the apostrophe and the accent."
