# The names of three subjects as the student writes them (D-343, D-354: no dash in the two sciences).
# `subjects` is append-only (triggers block UPDATE), so `subjects.name_it` stays the seed name and Subject#name_it reads
# this table first. A key that is not here shows the column.
it:
  subjects:
    display_name_it:
      chemistry: "Scienze integrate Chimica"
      biology: "Scienze integrate Biologia"
      geography: "Geografia economica"
