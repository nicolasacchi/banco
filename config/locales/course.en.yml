      idea_it: "The idea in brief"
      example_it: "Worked example"
      mistakes_it: "Mistakes to avoid"
      try: "Your turn"
      book_it: "In the book"
      summary_it: "Summary"
    exercise: "Exercise %{n}"
    solution_title: "Solution"
    loading_solution: "One moment."
    error: "I can't show the solution. Try again."
    back: "Back to the topic"
    try: "Do the exercise on paper, then check."
    show_solution: "Show the solution"
  practice:
    paper: "The working is on paper, here only the result."
    close_rule: "To close the topic: in every skill, 3 exercises right without help, at least 2 of them to write, match or put in order."
    # What a skill not yet shown still needs (D-340), from the fold's why.
    missing:
      exercises:
        one: "You still need one exercise right without help."
        other: "You still need %{count} exercises right without help."
      # Hard to guess (DEMONSTRATE_MIN_LOW_GUESS): a written answer, an ordering or a matching of 4 rows or more; never «longer».
      long:
        one: "You still need one exercise right without help, to write, match or put in order: multiple-choice ones can be guessed, so they are not enough."
        other: "You still need %{count} exercises right without help, to write, match or put in order: multiple-choice ones can be guessed, so they are not enough."
      long_among:
        one: "One must be one to write, match or put in order: those cannot be guessed."
        other: "%{count} must be ones to write, match or put in order: those cannot be guessed."
    # D-390: every exercise of the skill is «Done» and the skill is still not shown: what to do, in one line.
    all_done:
      plain:
        one: "You have done all the exercises. To close it you still need one right without help: press «%{next}», a new one comes."
        other: "You have done all the exercises. To close it you still need %{count} right without help: press «%{next}», new ones come."
      long:
        one: "You have done all the exercises. To close it you still need one right, to write, match or put in order: press «%{next}», a new one comes."
        other: "You have done all the exercises. To close it you still need %{count} right, to write, match or put in order: press «%{next}», new ones come."
    submit: "Check"
    hint: "Show a hint (%{n} of %{total})"
    solution: "Show me the solution"
    correct: "Correct."
    correct_aided: "Correct, with a hint."
    accents_note: "Mind the accents."
    unrecognised: "It is not right yet. Read the hint and try again."
    unrecognised_no_hint: "It is not right yet. Try again."
    form: "The form of the answer is not the one asked for: read the instructions again and try again."
    second_wrong: "It is not right yet. Look at the solution, then try a similar exercise."
    near_miss: "Check how you wrote it: there may be a typo."
    undetermined: "I can't mark this answer by myself: the teacher will look at it."
    contest_note: "Do you think you are right? Press «It's fine for me»: the exercise closes and the teacher will look at it."
    contest_button: "It's fine for me"
    contested: "I sent your answer to the teacher: they will reply in «My comments». Meanwhile here is the solution: compare it with yours."
    contest_comment: "My answer, which I think is right: «%{raw}»."
    contest_comment_bare: "I think my answer is right."
    same_answer: "It is the same answer as before: change it, or ask for a hint."
    near_typo: "Nearly there: check how you wrote it, there may be a typo."
    near_one_word: "Nearly there: one word is missing, or there is one too many."
    # D-363: after a try that is not right on an item with rows, how many were right (never which)
    rows_right: "Right: %{right} of %{total}."
    full_sentence_note: "It was enough to write only the missing words: %{part}."
    # D-386: a right number written with a unit word the exercise itself uses
    unit_word_note: "The number is right. Next time write only the number, without «%{word}»."
    try_this: "Try this"
    try_this_reason: "A similar exercise, for the same mistake."
    after_solution: "Try a similar exercise"
    next: "Another exercise"
    back: "Back to the topic"
    not_counted: "This exercise does not count towards showing the skill."
    reseen: "You have already seen this exercise: it does not count towards showing the skill."
    # D-348, D-366: the exercise is of the same kind as the one before (the rule keeps the student on an item until one is right without help).
    same_item: "I am giving you a similar exercise: to move on to the next one you need one right."
    # D-348: every exercise of the skill was seen, none is open: nothing is served on its own and the teacher is told (practice_pool_exhaustions).
    exhausted: "You have seen all the exercises for this skill. We are preparing more."
    exhausted_note: "You can redo an exercise from the list: it does not count towards showing the skill."
    # D-366: every skill of the topic is demonstrated: the page says so instead of serving another exercise; it speaks of this topic only.
    topic_done:
      title: "You have finished this topic!"
      offer: "Want to do another one? Here it is:"
      next: "Go to the next topic"
      today: "Back to Today"
      schema: "See the schema"
    closed: "This exercise is closed: choose another one."
    # D-377: the topic was revised while an exercise of it was open: the answer is not graded and the new version of the exercise comes with this line.
    replaced: "This exercise has been updated: here it is in the new version."
    loading: "One moment."
    saving: "Checking the answer."
    empty: "Write an answer first."
    blocked: "I can't save right now. I will try again by myself, you won't lose your answer."
    error: "Something went wrong. Reload the page."
    # D-358: the line above an exercise that declares a typical error the student made lately; the item's own message follows.
    reminder_label: "Remember:"
    done_group: "Already done (%{n})"
    skill_now: "This skill is now: %{state}."
    hints_title: "Hints"
    right: "Right"
    nearly: "Nearly right"
    earlier: "Your earlier answer"
    right_note: "Right, with a note"
    clean_of: "Without help: %{n} out of 3"
    leave: "Leave"
    hint_n: "Hint %{n}"
    solution_title: "Solution"
