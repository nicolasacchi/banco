      ripasso: "Review of first year"
      ponte: "Bridge: a base you need"
      lezione: "Second-year programme"
      extra: "Optional topic"
    extra_badge: "Outside the programme"
    status:
      todo: "To do"
      in_progress: "In progress"
      done: "Done"
      known: "Already known"
    before: "It is better to do this first: %{topic}"
    programme: "From the programme, line %{line}: «%{fragment}»"
    tag_recover: "From the test: to review"
    tag_review: "To review"
    # The first time a tag shows on a page (D-348): what it means, in one line.
    recover_note:
      to_recover: "It means this part was not secure in the entry test: you close it with the exercises."
      to_review: "It means you had understood it, but you got it wrong recently: you close it with the exercises."
    minutes: "%{n} minutes"
    lesson: "Read the lesson"
    lesson_read: "Lesson read"
    lesson_unread: "To read"
    step_lesson: "Lesson"
    step_practice: "Exercises"
