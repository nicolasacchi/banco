# Texts of the course and practice pages (English mirror of course.it.yml). Short sentences,
# no italics, no capitals for emphasis, no emoji.
en:
  today:
    title: "Today"
    nothing: "There is nothing else to do here for now."
    entry:
      title: "Entry test"
      title_warmup: "Warm-up"
      not_open: "The test is not open yet. The teacher will tell you when."
      warmup: "If you like, try the controls. It is optional and takes a few minutes."
      warmup_again: "You have already tried the controls. If you like, you can do it again: it is optional."
      warmup_optional: "Do you want to try the controls first?"
      warmup_optional_link: "Warm-up, optional"
      all_done: "You have done all the subjects. Well done."
      done_line: "Already done: %{subjects}."
      done_results: "See the results"
    resume: "Resume"
    now: "Now"
    start: "Start"
    suggestions: "For today"
    later: "Later"
    # D-399: on the suggestion of the subject the teacher recommends, shown first.
    focus: "Your teacher suggests you start from here."
    reason:
      to_recover: "From the test, to review: %{skill}."
      to_learn: "In the entry test, to learn: %{skill}."
      to_review: "You knew it, now it is shaky: %{skill}."
      course_next: "It is the next topic of the course."
      resume: "You left it half done: resume from here."
    closed: "There is nothing to do here for now. Meanwhile study in the book, following the timetable."
    # Today, «Resume» card: one line, the most useful thing missing to close the topic (D-340).
    close_line:
      exercises:
        one: "To close it: in %{skill} do one more exercise right without help."
        other: "To close it: in %{skill} do %{count} more exercises right without help."
  # D-378: a skill (a topic) the entry test showed and nothing since moved; the same words on the subject list, the topic page, the practice page and the counters.
  # Not one of the engine's states (those are `states`, which test/lib/practice/rules_test.rb pins to Rules::STATES).
  state_known: "Already known"
  states:
    not_seen: "Not seen yet"
    to_recover: "From the test: to review"
    to_learn: "To learn"
    in_study: "In progress"
    demonstrated: "Shown"
    consolidated: "Solid"
    to_review: "To review"
  why:
    not_seen: "You haven't tried it yet."
    seed_demonstrated: "Already known: you showed it in the entry test of %{date}."
    seed_implied: "There was no need to check it: you showed a skill that uses it."
    seed_to_recover: "From the entry test: to review."
    seed_to_learn: "In the entry test: to learn."
    in_study: "Right without help: %{n} out of 3."
    demonstrated: "Shown on %{date}: 3 exercises right without help."
    consolidated: "Solid on %{date}: you did it right again after more than two weeks."
    to_review: "A mistake without help on %{date}: you need 2 right to go back to %{previous}."
  subjects:
    title: "Subjects"
    all: "All subjects"
  # Civics (D-345): a view over topics of other subjects, by the nuclei of the Linee guida.
  civics:
    title: "Civics"
    badge: "Required · across subjects"
    card_line: "Topics from other subjects, by theme."
    count:
      one: "%{count} topic"
      other: "%{count} topics"
    intro: "Civics is required. Its topics are inside the other subjects: here you find them gathered."
    nuclei:
      constitution:
        title: "Constitution"
        intro: "The rules of the Republic: the principles, rights and duties, the institutions, the European Union."
      sustainability:
        title: "Economic development and sustainability"
        intro: "Resources, environment, heritage, health and money: how to live and produce without using up the future."
      digital:
        title: "Digital citizenship"
        intro: "Staying safe online: data, rights, respect for others, sources."
  # Where S is (D-326): required topics (the programme) and optional ones (outside the programme), done out of all, and the state of the entry test.
  progress:
    # Honest progress (D-367): what the entry test showed, what the exercises did, the time still to study in hours; never a percentage.
    required:
      one: "Required: %{count} topic"
      other: "Required: %{count} topics"
    required_none: "Required: none"
    optional: "Optional: %{total}. Already known: %{known}. Done with the exercises: %{exercises}."
    known: "Already known: %{count}"
    exercises_done: "Done with the exercises: %{count}"
    section_exercises: "Done with exercises: %{count}"
    time_left:
      one: "Still to study: about %{count} hour"
      other: "Still to study: about %{count} hours"
    time_left_less: "Still to study: less than an hour"
    time_left_none: "Nothing is left to study."
    correct_exercises:
      one: "Correct exercises: %{count}"
      other: "Correct exercises: %{count}"
    entry_label: "Entry test"
    entry:
      done: "done"
      unfinished: "to finish"
      todo: "to do"
    entry_results: "See the results"
    filter_label: "Which topics to show"
    filter_all: "All"
    filter_missing: "Only what is missing"
    nothing_missing: "Nothing is missing here. Well done."
    today:
      title: "Your progress"
      link: "See the subjects"
