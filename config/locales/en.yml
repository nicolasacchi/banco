    help:
      title: "How to answer"
      common:
        - "When you have finished, press Send."
        - "If you don't know, press I don't know."
      number:
        - "Write only the number."
        - "For decimals use a comma, for example 0,75."
        - "For a negative number put the minus sign in front, for example -5."
      number_unit:
        - "The unit of measure is already written next to the box. Don't write it."
      fraction:
        - "Write the numerator in the box above and the denominator in the box below."
        - "For a negative fraction put the minus sign in the numerator, for example -3 above and 4 below."
      fraction_mixed:
        - "If there is a whole part, write it in its own box."
      expression:
        - "Write in the field with the keyboard. Below you see how your formula was read."
        - "A fraction: press 3, then the slash /, then 4. Then press the right arrow."
        - "A power: press x, then ^, then 2. Then press the right arrow to leave the exponent."
        - "A product: press 3, a, ^, 2, the right arrow, then b."
        - "A bracket: press (, a, +, b, ), then ^ and 2."
        - "A root: write rad and then the number."
        - "A decimal: use a comma. A division: use the colon, for example 12:4."
      choice:
        - "Choose one answer only."
        - "You can click the option, or press its number on the keyboard."
        - "Use the arrows to move between the options."
      ordering:
        - "Put the lines in the right order."
        - "With the mouse, press Up or Down on a line."
        - "With the keyboard, go to a line with Tab, then press Alt with the up or down arrow."
      matching:
        - "For each item choose an answer from the menu."
        - "Each answer is used once only. One answer is left over."
      matching_reuse:
        - "In this question one answer can be used for more than one item."
      normalized_text:
        - "Write the answer in the box, with a few words."
        - "Check that you have written all the letters."
      normalized_text_accents:
        - "For a letter with an accent use the buttons under the box."
      tiles:
        - "Tap a word: it goes into your sentence."
        - "To remove it, tap it in your sentence."
        - "Some words are not needed."
      select:
        - "Tap an area of the picture to choose it."
        - "To undo the choice, tap it again."
        - "With the keyboard: Tab goes into the picture, the arrows change area, Space chooses."
      short_answer:
        - "Write the answer in your own words."
        - "Use short, complete sentences."
        - "The teacher reads it. You will see it marked later."
      testlet:
        - "Read the passage first."
        - "Then answer each question."
        - "For each question write the answer, or tick I don't know."
        - "Press Send only once, at the end."
