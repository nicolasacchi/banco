    your_text: "Il tuo testo consegnato"
    correction: "Correzione del docente"
    again: "Scrivi una nuova versione"
    cancel: "Annulla"
    empty: "Scrivi qualcosa prima di consegnare."
    too_long: "Il testo è troppo lungo: al massimo %{max} caratteri."
    pending: "Il testo che hai già consegnato aspetta ancora la correzione."
