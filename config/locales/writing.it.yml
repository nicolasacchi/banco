# «Scrivi tu» (D-407): il testo che lo studente scrive da sé su un argomento e che il docente corregge, e la riga di Oggi sulla correzione nuova.
# Il gemello inglese è writing.en.yml. I testi del docente (la pagina «Testi da correggere») sono in teacher_writing.it.yml.
it:
