# Italian texts of the check components of lesson/2 (select, tiles, ordering; WAVE2 2.11, A9): controls, live-region sentences, the fixed
# how-to line of a component's first use in a lesson, and its "Come si risponde" entry. Short sentences, plain words. Read through
# lesson2_texts as t.checks (the lesson page) and never written by an author.
it:
  lesson2:
    checks:
      # the one line printed on the first use of a component in a lesson (A9)
      howto:
        select_many: "Tocca le zone giuste, poi premi Controlla."
        select_one: "Tocca una zona, poi premi Controlla."
        tiles: "Tocca le tessere nell'ordine giusto. Per toglierne una, toccala di nuovo."
        tiles_sentence: "Tocca le parole nell'ordine giusto. Per toglierne una, toccala di nuovo."
        ordering: "Usa Su e Giù per mettere le voci in ordine, poi premi Controlla."
      # "Come si risponde": lines and a small example, closed until the student opens it
      help_title: "Come si risponde"
      help_example: "Esempio"
      help:
        select:
          lines:
            - "Tocca una zona del disegno per sceglierla."
            - "Per togliere la scelta, toccala di nuovo."
            - "Con la tastiera: Tab entra nel disegno, le frecce cambiano zona, Spazio sceglie."
          example: "Tocchi due zone. Sotto il disegno leggi «Selezionate: 2». Poi premi Controlla."
        # tiles: the neutral words (the tiles may be words, facts, symbols: D-310); tiles_sentence: a check with `builds: sentence`
        tiles:
          lines:
            - "Tocca una tessera: va nella tua risposta."
            - "Per toglierla, toccala nella tua risposta."
            - "Con la tastiera: Invio sceglie una tessera, le frecce destra e sinistra la spostano."
            - "Alcune tessere possono restare fuori."
          example: "Tocchi tre tessere, una dopo l'altra: vanno nella tua risposta in quell'ordine. Poi premi Controlla."
        tiles_sentence:
          lines:
            - "Tocca una parola: va nella tua frase."
            - "Per toglierla, toccala nella tua frase."
            - "Con la tastiera: Invio sceglie una parola, le frecce destra e sinistra la spostano."
            - "Alcune parole non servono."
          example: "Tocchi «If», «it», «rains»: la frase diventa «If it rains». Poi premi Controlla."
        ordering:
          lines:
            - "Ogni voce ha due pulsanti: Su e Giù."
            - "Premi Su per portare la voce più in alto."
            - "Con la tastiera: Alt con la freccia su o giù sposta la voce."
          example: "Premi Giù sulla prima voce: passa al secondo posto. Alla fine premi Controlla."
      # tiles: the neutral words, and those of a check that builds a sentence (`builds: sentence`, D-310)
      tiles_line: "La tua risposta"
      tiles_bank: "Le tessere"
      tiles_empty: "Tocca le tessere qui sotto."
      tile_used: "%{text}, già nella risposta."
      tile_placed: "La tua risposta: %{text}."
      tiles_sentence:
        line: "La tua frase"
        bank: "Le parole"
        empty: "Tocca le parole qui sotto."
        used: "%{text}, già nella frase."
        placed: "La tua frase: %{text}."
      tiles_clear: "Svuota"
      tiles_cleared: "Hai tolto tutto."
      tiles_listen: "Ascolta la frase"
      tile_built: "%{text}, posto %{n} di %{total}. Toccala per toglierla. Con le frecce la sposti."
      tile_removed: "Hai tolto: %{text}."
      tile_moved: "Ora è al posto %{n} di %{total}."
      # ordering
      order_list: "Le voci da mettere in ordine"
      order_up: "Sposta su: %{text}"
      order_down: "Sposta giù: %{text}"
      order_moved: "Ora è al posto %{n} di %{total}."
      # select
      select_group: "Zone da toccare"
      select_zone: "zona %{n} di %{total}"
      select_zone_short: "zona %{n} di %{total}"
      select_count: "Selezionate: %{n}"
      select_print: "Scrivi i numeri: ____"
      select_none: "Nessuna zona selezionata."
      select_none_one: "Tocca la zona giusta."
      # the teacher's view
      teacher_built: "Frase costruita"
      teacher_list: "Elenco"
      teacher_zones: "Zone"
      teacher_pick_one: "una sola zona"
      teacher_pick_many: "tutte le zone indicate"
