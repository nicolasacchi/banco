    rows_right: "Giuste: %{right} su %{total}."
    full_sentence_note: "Bastava scrivere solo le parole che mancano: %{part}."
    # D-386: a right number written with a unit word the exercise itself uses
    unit_word_note: "Il numero è giusto. La prossima volta scrivi solo il numero, senza «%{word}»."
    # D-358: the line above an exercise that declares a typical error the student made lately; the item's own message follows.
    reminder_label: "Ricorda:"
    try_this: "Prova questo"
    try_this_reason: "Un esercizio simile, per lo stesso errore."
    after_solution: "Prova un esercizio simile"
    next: "Un altro esercizio"
    back: "Torna all'argomento"
    not_counted: "Questo esercizio non conta per dimostrare l'abilità."
    reseen: "Questo esercizio l'hai già visto: non conta per dimostrare l'abilità."
    # D-348, D-366: the exercise is of the same kind as the one before (the rule keeps the student on an item until one is right without help).
    same_item: "Ti propongo un esercizio simile: per passare al prossimo ne serve uno giusto."
    # D-348: every exercise of the skill was seen, none is open: nothing is served on its own and the teacher is told (practice_pool_exhaustions).
    exhausted: "Hai visto tutti gli esercizi di questa abilità. Ne stiamo preparando altri."
    exhausted_note: "Puoi rifare un esercizio dalla lista: non conta per dimostrare l'abilità."
