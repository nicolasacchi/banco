    close_rule: "Per chiudere l'argomento: in ogni abilità, 3 esercizi giusti senza aiuto, almeno 2 da scrivere, abbinare o mettere in ordine."
    # What a skill not yet demonstrated still needs (D-340), from the fold's why.
    missing:
      exercises:
        one: "Ti manca un esercizio giusto senza aiuto."
        other: "Ti mancano %{count} esercizi giusti senza aiuto."
      # Hard to guess (DEMONSTRATE_MIN_LOW_GUESS): a written answer, an ordering or a matching of 4 rows or more; never «longer».
      long:
        one: "Ti manca un esercizio giusto senza aiuto, da scrivere, abbinare o mettere in ordine: quelli a scelta si possono indovinare e non bastano."
        other: "Ti mancano %{count} esercizi giusti senza aiuto, da scrivere, abbinare o mettere in ordine: quelli a scelta si possono indovinare e non bastano."
      long_among:
        one: "Uno deve essere da scrivere, abbinare o mettere in ordine: quelli non si possono indovinare."
        other: "%{count} devono essere da scrivere, abbinare o mettere in ordine: quelli non si possono indovinare."
    # D-390: every exercise of the skill is «Fatto» and the skill is still not shown: what to do, in one line.
    all_done:
      plain:
        one: "Hai fatto tutti gli esercizi. Per chiudere ne serve ancora uno giusto senza aiuto: premi «%{next}», ne arriva uno nuovo."
        other: "Hai fatto tutti gli esercizi. Per chiudere ne servono ancora %{count} giusti senza aiuto: premi «%{next}», ne arrivano di nuovi."
      long:
        one: "Hai fatto tutti gli esercizi. Per chiudere ne serve ancora uno giusto da scrivere, abbinare o mettere in ordine: premi «%{next}», ne arriva uno nuovo."
        other: "Hai fatto tutti gli esercizi. Per chiudere ne servono ancora %{count} giusti da scrivere, abbinare o mettere in ordine: premi «%{next}», ne arrivano di nuovi."
