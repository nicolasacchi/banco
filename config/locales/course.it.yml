# Texts of the course and practice pages (Phase 1b, A9.4). The meaning is fixed by the spec; the
# wording may be polished. Short sentences, no italics, no capitals for emphasis, no emoji.
it:
  today:
    title: "Oggi"
    nothing: "Per ora non c'è altro da fare qui."
    entry:
      title: "Test d'ingresso"
      title_warmup: "Riscaldamento"
      not_open: "Il test non è ancora aperto. Il docente ti dice quando."
      warmup: "Se vuoi, prova i comandi. È facoltativo e ci vogliono pochi minuti."
      warmup_again: "Hai già fatto la prova dei comandi. Se vuoi, puoi rifarla: è facoltativa."
      warmup_optional: "Vuoi provare i comandi prima?"
      warmup_optional_link: "Riscaldamento, facoltativo"
      all_done: "Hai fatto tutte le materie. Bravo."
      done_line: "Già fatte: %{subjects}."
      done_results: "Vedi i risultati"
    resume: "Riprendi"
    now: "Ora"
    start: "Comincia"
    suggestions: "Per oggi"
    later: "Dopo"
    # D-399: on the suggestion of the subject the teacher recommends, shown first.
    focus: "Il docente ti consiglia di cominciare da qui."
    reason:
      to_recover: "Dal test è risultata da ripassare: %{skill}."
      to_learn: "Nella diagnosi è risultata da imparare: %{skill}."
      to_review: "La sapevi, ora vacilla: %{skill}."
      course_next: "È il prossimo argomento del corso."
      resume: "L'avevi lasciato a metà: riprendi da qui."
    closed: "Per ora qui non c'è niente da fare. Intanto studia sul libro secondo l'orario."
    # Oggi, «Riprendi» card: one line, the most useful thing missing to close the topic (D-340).
    close_line:
      exercises:
        one: "Per chiuderlo: in %{skill} fai ancora un esercizio giusto senza aiuto."
        other: "Per chiuderlo: in %{skill} fai ancora %{count} esercizi giusti senza aiuto."
  # D-378: a skill (a topic) the entry test showed and nothing since moved; the same words on the subject list, the topic page, the practice page and the counters.
  # Not one of the engine's states (those are `states`, which test/lib/practice/rules_test.rb pins to Rules::STATES).
  state_known: "Già sapevi"
  states:
    not_seen: "Non ancora vista"
    to_recover: "Dal test: da ripassare"
    to_learn: "Da imparare"
    in_study: "In studio"
    demonstrated: "Dimostrata"
    consolidated: "Consolidata"
    to_review: "Da ripassare"
  why:
    not_seen: "Non l'hai ancora provata."
    seed_demonstrated: "Già sapevi: l'hai dimostrato nel test d'ingresso del %{date}."
    seed_implied: "Non serviva verificarla: hai dimostrato un'abilità che la usa."
    seed_to_recover: "Dal test d'ingresso: da ripassare."
    seed_to_learn: "Nella diagnosi: da imparare."
    in_study: "Corrette senza aiuto: %{n} su 3."
    demonstrated: "Dimostrata il %{date}: 3 esercizi giusti senza aiuto."
    consolidated: "Consolidata il %{date}: l'hai rifatta giusta dopo più di due settimane."
    to_review: "Un errore senza aiuto il %{date}: servono 2 corrette per tornare %{previous}."
  subjects:
    title: "Materie"
    all: "Tutte le materie"
  # Educazione civica (D-345): a view over topics of other subjects, by the nuclei of the Linee guida.
  civics:
    title: "Educazione civica"
    badge: "Obbligatoria · in più materie"
    card_line: "Argomenti di altre materie, per temi."
    count:
      one: "%{count} argomento"
      other: "%{count} argomenti"
    intro: "Educazione civica è obbligatoria. I suoi argomenti sono dentro le altre materie: qui li trovi raccolti."
    nuclei:
      constitution:
        title: "Costituzione"
        intro: "Le regole della Repubblica: i principi, i diritti e doveri, le istituzioni, l'Unione europea."
      sustainability:
        title: "Sviluppo economico e sostenibilità"
        intro: "Risorse, ambiente, patrimonio, salute e denaro: come si vive e si produce senza consumare il futuro."
      digital:
        title: "Cittadinanza digitale"
        intro: "Stare in rete in sicurezza: dati, diritti, rispetto degli altri, fonti."
  # Where S is (D-326): mandatory topics (the programme) and optional ones (fuori programma), done out of all, and the state of the entry test.
  progress:
    # Honest progress (D-367): what the entry test showed, what the exercises did, the time still to study in hours; never a percentage.
    required:
      one: "Obbligatori: %{count} argomento"
      other: "Obbligatori: %{count} argomenti"
    required_none: "Obbligatori: nessuno"
    optional: "Facoltativi: %{total}. Già sapevi: %{known}. Fatti con gli esercizi: %{exercises}."
