    contest_comment_bare: "Secondo me la mia risposta è giusta."
    same_answer: "È la stessa risposta di prima: cambiala, oppure chiedi un aiuto."
    near_typo: "Ci sei quasi: controlla come l'hai scritta, forse c'è un errore di battitura."
    near_one_word: "Ci sei quasi: manca una parola, oppure ce n'è una in più."
