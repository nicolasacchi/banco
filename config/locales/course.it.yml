    form: "La forma della risposta non è quella richiesta: rileggi la consegna e riprova."
    second_wrong: "Non è ancora giusta. Guarda la soluzione, poi prova un esercizio simile."
    near_miss: "Controlla come l'hai scritta: forse c'è un errore di battitura."
    undetermined: "Non riesco a correggere questa risposta da solo: la vedrà il docente."
    contest_note: "Pensi di avere ragione? Premi «Per me va bene così»: l'esercizio si chiude e lo guarda il docente."
