# Two lanes: ordinary jobs on 3 threads, Chrome work on exactly 1 thread (one
# Chrome at a time, behind the ChromeRunner lock).
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: default
      threads: 3
      processes: 1
      polling_interval: 1
    - queues: chrome
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
