# Two lanes: ordinary jobs on 3 threads, Chrome work on 2 threads: two runs at a time, one in each of the two slots of the ChromeRunner lock
# (Validation::ChromeRunner::SLOTS, a test keeps the two numbers equal; each slot has its own browser and the reaper waits for a quiet moment, D-402).
# The first lane also takes the
# search embeddings (SearchEmbedJob, D-315) and the spoken clips of the lessons (SpeakLessonRevisionJob, D-359), only when no ordinary job waits: the
# queues are polled in the order given. One embedder runs at a time (Search::Lease).
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ default, search, speech ]
      threads: 3
      processes: 1
      polling_interval: 1
    - queues: chrome
      threads: 2
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
