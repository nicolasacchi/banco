<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Qualcosa non ha funzionato</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { font-size: 20px; }
      body { margin: 0; background: #fbf3df; color: #1c1a14; font-family: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif; line-height: 1.6; }
      main { max-width: 36rem; margin: 0 auto; padding: 4rem 1rem; text-align: center; }
      h1 { font-size: 1.75rem; line-height: 1.3; margin: 0 0 1rem; }
      p { margin: 0 auto 1.5rem; max-width: 40ch; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: 0.5rem 1.25rem; border: 2px solid #1d3b5c; border-radius: 0.7rem; background: #1d3b5c; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #0b3d91; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) { body { background: #1b1a17; color: #f3ecdc; } a { background: #f0dfae; border-color: #f0dfae; color: #1b1a17; } a:focus-visible { outline-color: #9cc3ff; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Qualcosa non ha funzionato</h1>
      <p>Non è colpa tua. Riprova tra poco; se succede ancora, scrivilo all'insegnante.</p>
      <a href="/">Torna all'inizio</a>
    </main>
  </body>
</html>
